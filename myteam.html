<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>👕 تیم من | گیمی‌مود</title>
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:tahoma;
    background:#101010;
    color:white;
    padding-bottom:30px;
}

header{
    background:linear-gradient(135deg,#00bcd4,#006b7a);
    padding:20px;
    text-align:center;
    font-size:27px;
    font-weight:bold;
}

.box{
    width:94%;
    max-width:900px;
    margin:20px auto;
    padding:20px;
    background:#202020;
    border-radius:20px;
    box-shadow:0 0 15px #000;
}

.club{
    text-align:center;
    background:linear-gradient(135deg,#302b63,#24243e);
}

.clubName{
    font-size:30px;
    font-weight:bold;
    color:#00e5ff;
}

.manager{
    margin-top:10px;
    color:#ddd;
}

.stats{
    display:grid;
    grid-template-columns:
    repeat(3,1fr);
    gap:10px;
    margin-top:20px;
}

.stat{
    background:#151515;
    padding:15px;
    border-radius:14px;
    text-align:center;
}

.stat b{
    display:block;
    color:#00e5ff;
    font-size:22px;
    margin-top:7px;
}

.players{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.player{
    background:#181818;
    border-radius:15px;
    padding:15px;
    text-align:center;
    border:2px solid #333;
}

.playerName{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.position{
    color:#aaa;
    margin-bottom:8px;
}

.rating{
    color:#ffd700;
    font-size:24px;
    font-weight:bold;
}

.actions{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.button{
    display:block;
    padding:15px;
    border-radius:13px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    text-align:center;
    background:#333;
}

.blue{
    background:#00bcd4;
}

.green{
    background:#16a085;
}

.purple{
    background:#8e44ad;
}

.orange{
    background:#e67e22;
}

.red{
    background:#c0392b;
}

.warning{
    text-align:center;
    padding:20px;
    line-height:2;
}

</style>
</head>
<body>
<header>
👕 تیم من
</header>
<section class="box club">
<div class="clubName" id="clubName">
باشگاه من
</div>
<div class="manager" id="manager">
مربی: -
</div>
<div class="manager" id="uniform">
👕 رنگ لباس: -
</div>
<div class="stats">
<div class="stat">
💪 قدرت تیم
<b id="power">0</b>
</div>
<div class="stat">
🏆 لیگ
<b id="league">دسته ۲</b>
</div>
<div class="stat">
💎 الماس
<b id="diamonds">0</b>
</div>
</div>
</section>
<section class="box">
<h2 style="text-align:center;color:#00e5ff">
⚽ بازیکنان من
</h2>
<div class="players" id="players"></div>
</section>
<section class="box">
<h2 style="text-align:center;color:#00e5ff">
🎮 مدیریت باشگاه
</h2>
<div class="actions">
<a class="button blue" href="players.html">
🛒 خرید بازیکن
</a>
<a class="button purple" href="football.html">
⚽ مسابقه
</a>
<a class="button green" href="league.html">
🏆 لیگ
</a>
<a class="button orange" href="packs.html">
🎁 پک فوتبال
</a>
<a class="button red" href="cup.html">
🏆 جام حذفی ایران
</a>
</div>
</section>
<script>

/* =========================
   اطلاعات باشگاه
========================= */

const clubName =
localStorage.getItem("clubName");

const firstName =
localStorage.getItem("managerFirstName");

const lastName =
localStorage.getItem("managerLastName");

const color =
localStorage.getItem("clubColor");

const league =
localStorage.getItem("league") ||
"دسته ۲";

const power =
Number(
localStorage.getItem("clubPower")
) || 0;

const diamonds =
Number(
localStorage.getItem("footballDiamonds")
) || 0;


/* =========================
   نمایش اطلاعات
========================= */

document.getElementById(
"clubName"
).innerHTML =
clubName || "باشگاه من";


document.getElementById(
"manager"
).innerHTML =
"👤 مربی: "+
(firstName || "")+
" "+
(lastName || "");


document.getElementById(
"uniform"
).innerHTML =
"👕 رنگ لباس: "+
(color || "-");


document.getElementById(
"league"
).innerHTML =
league;


document.getElementById(
"power"
).innerHTML =
power;


document.getElementById(
"diamonds"
).innerHTML =
diamonds;


/* =========================
   بازیکنان
========================= */

let myPlayers =
JSON.parse(
localStorage.getItem(
"myPlayers"
)
) || [];


const playersBox =
document.getElementById(
"players"
);


if(myPlayers.length===0){

    playersBox.innerHTML =
    "<div class='warning'>"+
    "⚠️ هنوز باشگاهی نساختی.<br>"+
    "اول باشگاه خودت را بساز."+
    "<br><br>"+
    "<a class='button blue' href='setup.html'>"+
    "🚀 ساخت باشگاه"+
    "</a>"+
    "</div>";

}
else{

    myPlayers.forEach(
    function(player){

        const card =
        document.createElement(
            "div"
        );

        card.className =
        "player";


        let position =
        "⚽ بازیکن";


        if(player.position==="GK"){
            position =
            "🧤 دروازه‌بان";
        }

        if(player.position==="DEF"){
            position =
            "🛡️ مدافع";
        }

        if(player.position==="MID"){
            position =
            "⚡ هافبک";
        }

        if(player.position==="ATT"){
            position =
            "🔥 مهاجم";
        }


        card.innerHTML =

        "<div class='playerName'>"+
        player.name+
        "</div>"+

        "<div class='position'>"+
        position+
        "</div>"+

        "<div class='rating'>"+
        "⭐ "+
        player.rating+
        "</div>";


        playersBox.appendChild(
            card
        );

    });

}

</script>
</body>
</html>
