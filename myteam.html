<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ تیم من | گیمی‌مود</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:white;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:20px;
text-align:center;
}

header h1{
margin:0 0 8px;
}

.container{
width:94%;
max-width:1000px;
margin:18px auto;
}

.info{
background:#1c1c1c;
padding:15px;
border-radius:15px;
margin-bottom:15px;
text-align:center;
}

.formations{
display:flex;
gap:8px;
overflow-x:auto;
padding:5px;
margin-bottom:15px;
}

.formation{
min-width:90px;
background:#292929;
color:white;
}

.formation.active{
background:#00bcd4;
}

.field{
position:relative;
height:570px;
border:5px solid white;
border-radius:16px;
overflow:hidden;

background:
repeating-linear-gradient(
90deg,
#147636 0,
#147636 70px,
#18813b 70px,
#18813b 140px
);
}

.line{
position:absolute;
left:50%;
top:0;
height:100%;
width:3px;
background:white;
}

.circle{
position:absolute;
left:50%;
top:50%;
width:110px;
height:110px;
border:3px solid white;
border-radius:50%;
transform:translate(-50%,-50%);
}

.player{
position:absolute;
width:55px;
height:55px;
border-radius:50%;
background:#d71920;
border:3px solid white;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:bold;
text-align:center;
padding:3px;
cursor:pointer;
transform:translate(-50%,-50%);
}

.player.gk{
box-shadow:0 0 0 4px #ffd700;
}

.player.empty{
background:#333;
color:#aaa;
border-style:dashed;
}

.playersBox{
margin-top:15px;
background:#1c1c1c;
border-radius:16px;
padding:15px;
}

.playersGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-top:12px;
}

.playerCard{
background:#292929;
padding:12px;
border-radius:12px;
}

.playerCard b{
font-size:17px;
}

.playerCard button{
width:100%;
margin-top:8px;
padding:9px;
border:0;
border-radius:9px;
background:#00bcd4;
color:white;
font-weight:bold;
}

.save{
width:100%;
padding:15px;
margin-top:15px;
border:0;
border-radius:12px;
background:#00c853;
color:white;
font-size:18px;
font-weight:bold;
}

.back{
display:block;
width:230px;
margin:25px auto;
padding:14px;
background:#333;
color:white;
text-decoration:none;
border-radius:12px;
text-align:center;
}

.status{
margin-top:12px;
background:#151515;
padding:12px;
border-radius:12px;
text-align:center;
}

</style>
</head>
<body>
<header>
<h1>👕 تیم من</h1>
<div>
ترکیب تیم خودت را بساز
</div>
</header>
<div class="container">
<div class="info">
💰 ارزش باشگاه:
<b id="clubValue">0</b>
<br><br>
👥 تعداد بازیکنان:
<b id="playerCount">0</b>
</div>
<div class="formations">
<button
class="formation active"
onclick="chooseFormation('4-3-3',this)">
4-3-3
</button>
<button
class="formation"
onclick="chooseFormation('4-4-2',this)">
4-4-2
</button>
<button
class="formation"
onclick="chooseFormation('3-4-3',this)">
3-4-3
</button>
<button
class="formation"
onclick="chooseFormation('5-3-2',this)">
5-3-2
</button>
<button
class="formation"
onclick="chooseFormation('3-5-2',this)">
3-5-2
</button>
</div>
<div class="field">
<div class="line"></div>
<div class="circle"></div>
<div id="fieldPlayers"></div>
</div>
<div class="status" id="status">
ترکیب 4-3-3 انتخاب شده است.
</div>
<div class="playersBox">
<h2>👥 بازیکنان من</h2>
<div
class="playersGrid"
id="playersGrid">
</div>
</div>
<button
class="save"
onclick="saveLineup()">
💾 ذخیره ترکیب
</button>
<a
class="back"
href="players.html">
🛒 رفتن به بازار بازیکنان
</a>
</div>
<script>

/* ==============================
   اطلاعات بازیکنان
============================== */

let owned=
JSON.parse(
localStorage.getItem("ownedPlayers")
) || [];


/*
 اگر بازیکن‌های قبلی در ownedPlayers
 نبودند، از lineup هم استفاده می‌کنیم.
*/

if(!owned.length){

let oldLineup=
JSON.parse(
localStorage.getItem("lineup")
) || {};

owned=
Object.values(oldLineup);

}


/* ==============================
   آرایش فعلی
============================== */

let formation=
localStorage.getItem("formation")
||"4-3-3";


/* ==============================
   ترکیب فعلی
============================== */

let lineup=
JSON.parse(
localStorage.getItem("lineup")
) || {};


/* ==============================
   محل بازیکنان
============================== */

const positions={

"4-3-3":[

{role:"GK",x:8,y:50},

{role:"DEF",x:25,y:18},
{role:"DEF",x:22,y:40},
{role:"DEF",x:22,y:60},
{role:"DEF",x:25,y:82},

{role:"MID",x:43,y:25},
{role:"MID",x:43,y:50},
{role:"MID",x:43,y:75},

{role:"ATT",x:67,y:25},
{role:"ATT",x:70,y:50},
{role:"ATT",x:67,y:75}

],

"4-4-2":[

{role:"GK",x:8,y:50},

{role:"DEF",x:25,y:18},
{role:"DEF",x:22,y:40},
{role:"DEF",x:22,y:60},
{role:"DEF",x:25,y:82},

{role:"MID",x:42,y:18},
{role:"MID",x:42,y:40},
{role:"MID",x:42,y:60},
{role:"MID",x:42,y:82},

{role:"ATT",x:68,y:40},
{role:"ATT",x:68,y:60}

],

"3-4-3":[

{role:"GK",x:8,y:50},

{role:"DEF",x:25,y:25},
{role:"DEF",x:22,y:50},
{role:"DEF",x:25,y:75},

{role:"MID",x:42,y:18},
{role:"MID",x:42,y:40},
{role:"MID",x:42,y:60},
{role:"MID",x:42,y:82},

{role:"ATT",x:68,y:25},
{role:"ATT",x:70,y:50},
{role:"ATT",x:68,y:75}

],

"5-3-2":[

{role:"GK",x:8,y:50},

{role:"DEF",x:23,y:12},
{role:"DEF",x:20,y:32},
{role:"DEF",x:20,y:50},
{role:"DEF",x:20,y:68},
{role:"DEF",x:23,y:88},

{role:"MID",x:43,y:25},
{role:"MID",x:43,y:50},
{role:"MID",x:43,y:75},

{role:"ATT",x:68,y:40},
{role:"ATT",x:68,y:60}

],

"3-5-2":[

{role:"GK",x:8,y:50},

{role:"DEF",x:25,y:25},
{role:"DEF",x:22,y:50},
{role:"DEF",x:25,y:75},

{role:"MID",x:42,y:12},
{role:"MID",x:42,y:30},
{role:"MID",x:42,y:50},
{role:"MID",x:42,y:70},
{role:"MID",x:42,y:88},

{role:"ATT",x:68,y:40},
{role:"ATT",x:68,y:60}

]

};


/* ==============================
   انتخاب آرایش
============================== */

function chooseFormation(
newFormation,
button
){

formation=
newFormation;

localStorage.setItem(
"formation",
formation
);


document
.querySelectorAll(".formation")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");


document.getElementById(
"status"
).innerHTML=
"ترکیب "+
formation+
" انتخاب شد.";

renderField();

}


/* ==============================
   نمایش زمین
============================== */

function renderField(){

let container=
document.getElementById(
"fieldPlayers"
);

container.innerHTML="";


let spots=
positions[formation];


spots.forEach(
(spot,index)=>{

let p=
getLineupPlayer(index);

let div=
document.createElement("div");

div.className=
"player";

if(!p){

div.classList.add("empty");

div.innerHTML=
spot.role+
"<br>خالی";

}
else{

div.innerHTML=
p.name+
"<br>"+
"قدرت "+p.power;

if(spot.role==="GK"){
div.classList.add("gk");
}

}


div.style.left=
spot.x+"%";

div.style.top=
spot.y+"%";


container.appendChild(div);

}
);

}


/* ==============================
   بازیکن ترکیب
============================== */

function getLineupPlayer(index){

let keys=
Object.keys(lineup);

if(
!keys[index]
)return null;

return lineup[
keys[index]
];

}


/* ==============================
   نمایش بازیکنان
============================== */

function renderPlayers(){

let container=
document.getElementById(
"playersGrid"
);

container.innerHTML="";


owned.forEach(
(player,index)=>{

let card=
document.createElement("div");

card.className=
"playerCard";

card.innerHTML=

"<b>"+
player.name+
"</b>"+
"<br>"+
"قدرت: "+
player.power+
"<br>"+
"پست: "+
positionName(
player.position
)+

"<button onclick='addToLineup("+
index+
")'>"+
"➕ گذاشتن در ترکیب"+
"</button>";


container.appendChild(card);

}
);


document.getElementById(
"playerCount"
).innerHTML=
owned.length;


let value=
owned.reduce(
(sum,p)=>
sum+
Number(p.price||0),
0
);

document.getElementById(
"clubValue"
).innerHTML=
value.toLocaleString("fa-IR")+
" سکه";

}


/* ==============================
   اضافه کردن به ترکیب
============================== */

function addToLineup(index){

let player=
owned[index];

let keys=
Object.keys(lineup);

let spots=
positions[formation];


/*
 بازیکن را در اولین جای خالی
 قرار می‌دهیم.
*/

if(
keys.length>=spots.length
){

alert(
"ترکیب پر است! اول یک بازیکن را حذف کن."
);

return;

}


let key=
"player_"+Date.now()+"_"+index;


lineup[key]={

id:player.id,

name:player.name,

power:player.power,

position:player.position,

country:player.country

};


localStorage.setItem(
"lineup",
JSON.stringify(lineup)
);


renderField();


document.getElementById(
"status"
).innerHTML=
"✅ "+
player.name+
" به ترکیب اضافه شد.";

}


/* ==============================
   ذخیره
============================== */

function saveLineup(){

localStorage.setItem(
"lineup",
JSON.stringify(lineup)
);

localStorage.setItem(
"formation",
formation
);


alert(
"✅ ترکیب "+
formation+
" ذخیره شد!"
);

}


/* ==============================
   نام پست
============================== */

function positionName(position){

if(position==="GK")
return "🧤 دروازه‌بان";

if(position==="DEF")
return "🛡️ مدافع";

if(position==="MID")
return "🎯 هافبک";

return "⚡ مهاجم";

}


/* ==============================
   شروع صفحه
============================== */

function activateFormationButton(){

document
.querySelectorAll(".formation")
.forEach(
button=>{

if(
button.innerText.trim()===
formation
){

button.classList.add("active");

}
else{

button.classList.remove("active");

}

});

}


activateFormationButton();

renderPlayers();

renderField();

</script>
</body>

</html>
