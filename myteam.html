<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>👥 تیم من | گیمی‌مود</title>
<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:white;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:20px;
text-align:center;
font-size:27px;
font-weight:bold;
}

.box{
width:94%;
max-width:1000px;
margin:20px auto;
padding:20px;
background:#202020;
border-radius:20px;
box-shadow:0 0 15px #000;
}

.info{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(150px,1fr));
gap:12px;
}

.stat{
background:#151515;
padding:15px;
border-radius:14px;
text-align:center;
}

.stat span{
display:block;
font-size:13px;
color:#aaa;
}

.stat b{
display:block;
margin-top:7px;
font-size:23px;
color:#00e5ff;
}

.players{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:14px;
}

.player{
background:#171717;
border:2px solid #333;
border-radius:16px;
padding:16px;
text-align:center;
}

.player .icon{
font-size:35px;
}

.player .name{
font-size:18px;
font-weight:bold;
margin:8px 0;
}

.rating{
font-size:23px;
color:#ffd700;
font-weight:bold;
}

.position{
color:#aaa;
margin:6px;
}

.actions{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(190px,1fr));
gap:12px;
}

button,a{
border:0;
border-radius:12px;
padding:14px;
font-size:16px;
font-weight:bold;
text-decoration:none;
text-align:center;
cursor:pointer;
}

.market{
background:#16a085;
color:white;
}

.pack{
background:#8e44ad;
color:white;
}

.match{
background:#e67e22;
color:white;
}

.home{
background:#333;
color:white;
display:block;
width:230px;
margin:25px auto;
}

.empty{
padding:25px;
background:#151515;
border-radius:14px;
text-align:center;
line-height:2;
}

</style>
</head>
<body>
<header>
👥 تیم من
</header>
<section class="box">
<h2 style="text-align:center">
🏟️ <span id="clubName">تیم من</span>
</h2>
<div class="info">
<div class="stat">
<span>⭐ قدرت باشگاه</span>
<b id="power">60</b>
</div>
<div class="stat">
<span>🪙 سکه</span>
<b id="coins">0</b>
</div>
<div class="stat">
<span>💎 الماس</span>
<b id="diamonds">0</b>
</div>
<div class="stat">
<span>👥 تعداد بازیکنان</span>
<b id="playerCount">0</b>
</div>
<div class="stat">
<span>🏆 جام‌ها</span>
<b id="cups">0</b>
</div>
</div>
</section>
<section class="box">
<h2>⚽ ترکیب تیم</h2>
<div id="players" class="players"></div>
</section>
<section class="box">
<h2>🎮 بخش‌های تیم</h2>
<div class="actions">
<a class="market"
href="players.html">
🛒 بازار بازیکنان
</a>
<a class="pack"
href="packs.html">
🎁 پک فوتبال
</a>
<a class="match"
href="football.html">
⚽ شروع مسابقه
</a>
</div>
</section>
<a class="home"
href="index.html">
🏠 برگشت به خانه
</a>
<script>

/* =========================
   اطلاعات باشگاه
========================= */

let clubName=
localStorage.getItem(
"clubName"
) || "تیم من";


let power=
Number(
localStorage.getItem(
"clubPower"
)
) || 60;


let coins=
Number(
localStorage.getItem(
"coins"
)
) || 10000;


let diamonds=
Number(
localStorage.getItem(
"footballDiamonds"
)
) || 0;


let cups=
Number(
localStorage.getItem(
"cups"
)
) || 0;


let myPlayers=
JSON.parse(
localStorage.getItem(
"myPlayers"
)
) || [];


/* =========================
   نمایش اطلاعات
========================= */

document.getElementById(
"clubName"
).innerHTML=
clubName;


document.getElementById(
"power"
).innerHTML=
power;


document.getElementById(
"coins"
).innerHTML=
coins;


document.getElementById(
"diamonds"
).innerHTML=
diamonds;


document.getElementById(
"cups"
).innerHTML=
cups;


document.getElementById(
"playerCount"
).innerHTML=
myPlayers.length;


/* =========================
   نمایش بازیکنان
========================= */

const box=
document.getElementById(
"players"
);


if(myPlayers.length===0){

box.innerHTML=

"<div class='empty'>"+
"👤 هنوز بازیکنی نداری."+
"<br>"+
"از بازار یا پک فوتبال بازیکن بخر!"+
"</div>";

}
else{

myPlayers.forEach(
function(player,index){

let icon="⚽";

if(player.position==="GK"){
icon="🧤";
}

if(player.position==="DEF"){
icon="🛡️";
}

if(player.position==="MID"){
icon="⚡";
}

if(player.position==="ATT"){
icon="🔥";
}


let card=
document.createElement(
"div"
);

card.className=
"player";


card.innerHTML=

"<div class='icon'>"+
icon+
"</div>"+

"<div class='name'>"+
player.name+
"</div>"+

"<div class='position'>"+
positionName(
player.position
)+
"</div>"+

"<div class='rating'>"+
"⭐ "+
player.rating+
"</div>";


box.appendChild(
card
);

});

}


/* =========================
   نام پست
========================= */

function positionName(position){

if(position==="GK")
return "دروازه‌بان";

if(position==="DEF")
return "مدافع";

if(position==="MID")
return "هافبک";

if(position==="ATT")
return "مهاجم";

return "بازیکن";

}

</script>
</body>
</html>
