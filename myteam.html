<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛒 بازار بازیکنان | گیمی‌مود</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:white;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:20px;
text-align:center;
font-size:27px;
font-weight:bold;
}

.box{
width:94%;
max-width:1100px;
margin:18px auto;
padding:18px;
background:#202020;
border-radius:20px;
box-shadow:0 0 15px #000;
}

.balance{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

.money{
background:#151515;
padding:13px 25px;
border-radius:12px;
}

.money b{
color:#00e5ff;
font-size:21px;
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

input,select{
padding:13px;
border:0;
border-radius:10px;
font-size:16px;
background:#151515;
color:white;
}

.players{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(210px,1fr));
gap:14px;
}

.player{
background:#171717;
border:2px solid #333;
border-radius:16px;
padding:16px;
text-align:center;
}

.flag{
font-size:35px;
}

.name{
font-size:18px;
font-weight:bold;
margin:8px;
}

.rating{
color:#ffd700;
font-size:23px;
font-weight:bold;
}

.position{
color:#aaa;
margin:6px;
}

.price{
color:#00e5ff;
font-weight:bold;
margin:10px;
}

button{
border:0;
border-radius:10px;
padding:11px 18px;
background:#16a085;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#555;
}

.message{
margin-top:15px;
padding:15px;
background:#151515;
border-radius:12px;
text-align:center;
}

.back{
display:block;
width:230px;
margin:25px auto;
padding:14px;
background:#333;
color:white;
text-decoration:none;
border-radius:12px;
text-align:center;
}

</style>
</head>
<body>
<header>
🛒 بازار بازیکنان گیمی‌مود
</header>
<section class="box">
<div class="balance">
<div class="money">
🪙 سکه:
<b id="coins">0</b>
</div>
<div class="money">
💎 الماس:
<b id="diamonds">0</b>
</div>
<div class="money">
👥 بازیکنان تیم:
<b id="count">0</b>
</div>
</div>
</section>
<section class="box">
<h2>🔎 جستجو و فیلتر</h2>
<div class="filters">
<input
id="search"
type="text"
placeholder="نام بازیکن..."
oninput="render()">
<select id="country" onchange="render()">
<option value="all">
همه بازیکنان
</option>
<option value="iran">
🇮🇷 بازیکنان ایرانی
</option>
<option value="foreign">
🌍 بازیکنان خارجی
</option>
</select>
<select id="position" onchange="render()">
<option value="all">
همه پست‌ها
</option>
<option value="GK">
دروازه‌بان
</option>
<option value="DEF">
مدافع
</option>
<option value="MID">
هافبک
</option>
<option value="ATT">
مهاجم
</option>
</select>
</div>
</section>
<section class="box">
<h2>⚽ بازیکنان</h2>
<div
id="players"
class="players">
</div>
<div
id="message"
class="message">
بازیکنان بازار
</div>
</section>
<a
class="back"
href="myteam.html">
⬅️ برگشت به تیم من
</a>
<script>

/* =========================
   اطلاعات
========================= */

let coins=
Number(
localStorage.getItem("coins")
) || 10000;

let diamonds=
Number(
localStorage.getItem("footballDiamonds")
) || 0;

let myPlayers=
JSON.parse(
localStorage.getItem("myPlayers")
) || [];


/* =========================
   نام‌ها
========================= */

const iranFirst=[
"علی","محمد","مهدی","امیر","رضا",
"حسین","سعید","میلاد","احمد","پارسا",
"آریا","سینا","یاسین","سامان","اشکان",
"پویا","ماهان","کیان","بردیا","علیرضا"
];

const iranLast=[
"محمدی","حسینی","رضایی","کریمی",
"مرادی","اکبری","کاظمی","موسوی",
"نوری","جعفری","حیدری","صادقی",
"رحیمی","امیری","مهدوی","احمدی",
"قاسمی","عباسی","نعمتی","شریفی"
];


const foreignFirst=[
"Alex","Leo","Luca","Marco","Daniel",
"David","Lucas","Noah","Oliver","Adam",
"Rayan","Ethan","Mateo","Carlos","Luis",
"Jude","Victor","Kevin","Nico","Sergio"
];

const foreignLast=[
"Silva","Costa","Ramos","Garcia",
"Martin","Wilson","Brown","Walker",
"King","Young","Miller","Santos",
"Diaz","Torres","Lopez","Moretti",
"Romano","Mendes","Pereira","Sanchez"
];


/* =========================
   پست‌ها
========================= */

const positions=[
"GK","DEF","MID","ATT"
];

function getPosition(i){

return positions[
i%4
];

}


/* =========================
   تولید ۲۰۰۰ بازیکن
========================= */

let players=[];


/* ایرانی */

for(let i=0;i<1000;i++){

let first=
iranFirst[
i%iranFirst.length
];

let last=
iranLast[
Math.floor(
i/iranFirst.length
)%iranLast.length
];


let rating=
60+
(i%31);


let position=
getPosition(i);


let price=
1000+
(rating-60)*180;


players.push({

id:"ir"+i,

name:
first+" "+last+" "+(i+1),

country:"iran",

flag:"🇮🇷",

position:position,

rating:rating,

price:price,

currency:"coins"

});

}


/* خارجی */

for(let i=0;i<1000;i++){

let first=
foreignFirst[
i%foreignFirst.length
];

let last=
foreignLast[
Math.floor(
i/foreignFirst.length
)%foreignLast.length
];


let rating=
70+
(i%31);


let position=
getPosition(i);


let price=
2500+
(rating-70)*250;


players.push({

id:"fo"+i,

name:
first+" "+last+" "+(i+1),

country:"foreign",

flag:"🌍",

position:position,

rating:rating,

price:price,

currency:"coins"

});

}


/* =========================
   ستاره‌های ویژه
========================= */

players.push({

id:"ronaldo",
name:"رونالدو",
country:"foreign",
flag:"🌍",
position:"ATT",
rating:100,
price:50,
currency:"diamonds"
});


players.push({

id:"mbappe",
name:"امباپه",
country:"foreign",
flag:"🌍",
position:"ATT",
rating:100,
price:50,
currency:"diamonds"
});


players.push({

id:"yamal",
name:"یامال",
country:"foreign",
flag:"🌍",
position:"ATT",
rating:100,
price:50,
currency:"diamonds"
});


/* =========================
   نمایش
========================= */

function render(){

const box=
document.getElementById(
"players"
);

box.innerHTML="";


let search=
document.getElementById(
"search"
).value
.toLowerCase();


let country=
document.getElementById(
"country"
).value;


let position=
document.getElementById(
"position"
).value;


let filtered=
players.filter(
function(p){

let nameOK=
p.name
.toLowerCase()
.includes(search);

let countryOK=
country==="all" ||
p.country===country;

let positionOK=
position==="all" ||
p.position===position;

return(
nameOK &&
countryOK &&
positionOK
);

});


/* فقط 60 کارت همزمان */

filtered=
filtered.slice(0,60);


if(filtered.length===0){

box.innerHTML=
"<div class='message'>"+
"❌ بازیکنی پیدا نشد"+
"</div>";

return;

}


filtered.forEach(
function(p){

let div=
document.createElement(
"div"
);

div.className="player";


let priceText;

if(p.currency==="diamonds"){

priceText=
p.price+
" 💎";

}
else{

priceText=
p.price.toLocaleString()+
" 🪙";

}


div.innerHTML=

"<div class='flag'>"+
p.flag+
"</div>"+

"<div class='name'>"+
p.name+
"</div>"+

"<div class='rating'>"+
"⭐ "+
p.rating+
"</div>"+

"<div class='position'>"+
positionName(
p.position
)+
"</div>"+

"<div class='price'>"+
priceText+
"</div>"+

"<button "+
"onclick='buyPlayer(\""+
p.id+
"\")'>"+
"🛒 خرید بازیکن"+
"</button>";


box.appendChild(div);

});

}


/* =========================
   خرید
========================= */

function buyPlayer(id){

let player=
players.find(
p=>p.id===id
);

if(!player)return;


/* بررسی خرید تکراری */

let exists=
myPlayers.some(
p=>p.id===player.id
);

if(exists){

showMessage(
"⚠️ این بازیکن را قبلاً داری!"
);

return;

}


/* پرداخت */

if(player.currency==="diamonds"){

if(diamonds<player.price){

showMessage(
"❌ الماس کافی نداری!"
);

return;

}

diamonds-=player.price;

}
else{

if(coins<player.price){

showMessage(
"❌ سکه کافی نداری!"
);

return;

}

coins-=player.price;

}


/* اضافه کردن */

myPlayers.push({

id:player.id,

name:player.name,

country:player.country,

position:player.position,

rating:player.rating

});


localStorage.setItem(
"myPlayers",
JSON.stringify(
myPlayers
)
);


localStorage.setItem(
"coins",
coins
);


localStorage.setItem(
"footballDiamonds",
diamonds
);


/* افزایش قدرت باشگاه */

let power=
Number(
localStorage.getItem(
"clubPower"
)
) || 60;


power=
Math.min(
100,
power+
Math.max(
1,
Math.floor(
player.rating/35
)
)
);


localStorage.setItem(
"clubPower",
power
);


updateBalance();


showMessage(

"✅ "+
player.name+
" به تیم تو اضافه شد!"+
"<br>⭐ قدرت: "+
player.rating

);

}


/* =========================
   نام پست
========================= */

function positionName(p){

if(p==="GK")
return"🧤 دروازه‌بان";

if(p==="DEF")
return"🛡️ مدافع";

if(p==="MID")
return"⚡ هافبک";

if(p==="ATT")
return"🔥 مهاجم";

return"بازیکن";

}


/* =========================
   موجودی
========================= */

function updateBalance(){

document.getElementById(
"coins"
).innerHTML=
coins.toLocaleString();


document.getElementById(
"diamonds"
).innerHTML=
diamonds;


document.getElementById(
"count"
).innerHTML=
myPlayers.length;

}


/* =========================
   پیام
========================= */

function showMessage(text){

document.getElementById(
"message"
).innerHTML=
text;

}


updateBalance();

render();

</script>
</body>
</html>
