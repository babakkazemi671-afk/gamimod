<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎡 گردونه سکه | گیمی‌مود</title>
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:tahoma;
    background:#101010;
    color:white;
    text-align:center;
}

header{
    background:#00bcd4;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.balance{
    margin:20px;
    padding:20px;
    background:linear-gradient(135deg,#302b63,#24243e);
    border-radius:20px;
    box-shadow:0 0 15px #000;
}

.coins{
    font-size:34px;
    font-weight:bold;
}

.game{
    width:95%;
    max-width:650px;
    margin:20px auto;
    padding:25px 15px;
    background:#202020;
    border-radius:22px;
    box-shadow:0 0 15px #000;
}

.wheel-area{
    position:relative;
    width:340px;
    height:340px;
    max-width:90vw;
    max-height:90vw;
    margin:30px auto;
}

.wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    border:10px solid #ddd;
    position:relative;
    overflow:hidden;
    transition:transform 4s cubic-bezier(.15,.8,.2,1);
    background:
    conic-gradient(
        #8e44ad 0deg 36deg,
        #16a085 36deg 72deg,
        #e67e22 72deg 108deg,
        #c0392b 108deg 144deg,
        #2980b9 144deg 180deg,
        #27ae60 180deg 216deg,
        #f1c40f 216deg 252deg,
        #7f8c8d 252deg 288deg,
        #3498db 288deg 324deg,
        #9b59b6 324deg 360deg
    );
    box-shadow:0 0 25px #000;
}

.label{
    position:absolute;
    left:50%;
    top:50%;
    width:75px;
    height:75px;
    margin-left:-37px;
    margin-top:-37px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    font-size:12px;
    font-weight:bold;
    line-height:1.3;
    text-shadow:0 2px 3px #000;
}

.l1{transform:rotate(18deg) translateY(-125px) rotate(-18deg);}
.l2{transform:rotate(54deg) translateY(-125px) rotate(-54deg);}
.l3{transform:rotate(90deg) translateY(-125px) rotate(-90deg);}
.l4{transform:rotate(126deg) translateY(-125px) rotate(-126deg);}
.l5{transform:rotate(162deg) translateY(-125px) rotate(-162deg);}
.l6{transform:rotate(198deg) translateY(-125px) rotate(-198deg);}
.l7{transform:rotate(234deg) translateY(-125px) rotate(-234deg);}
.l8{transform:rotate(270deg) translateY(-125px) rotate(-270deg);}
.l9{transform:rotate(306deg) translateY(-125px) rotate(-306deg);}
.l10{transform:rotate(342deg) translateY(-125px) rotate(-342deg);}

.pointer{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:40px solid #ff1744;
    filter:drop-shadow(0 3px 3px #000);
}

.center{
    position:absolute;
    width:65px;
    height:65px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#111;
    border:5px solid white;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.spin{
    padding:15px 35px;
    border:0;
    border-radius:14px;
    background:#00bcd4;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

.spin:disabled{
    background:#555;
    cursor:not-allowed;
}

.result{
    margin:20px auto;
    padding:18px;
    background:#151515;
    border-radius:14px;
    line-height:2;
}

.prizes{
    margin:20px auto;
    padding:18px;
    background:#181818;
    border-radius:15px;
    line-height:2;
    text-align:right;
}

.prizes h3{
    text-align:center;
    color:#00e5ff;
}

.gold{
    color:#ffd700;
    font-weight:bold;
}

.back{
    display:block;
    width:230px;
    margin:25px auto;
    padding:14px;
    background:#333;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
}

</style>
</head>
<body>
<header>
🎡 گردونه سکه گیمی‌مود
</header>
<section class="balance">
<h2>🐷 موجودی قلک</h2>
<div class="coins" id="coins">
0 🪙
</div>
</section>
<section class="game">
<h2>🎡 گردونه جایزه</h2>
<div class="wheel-area">
<div class="pointer"></div>
<div class="wheel" id="wheel">
<div class="label l1">❌ پوچ</div>
<div class="label l2">🪙 ۱۰</div>
<div class="label l3">🪙 ۱۵</div>
<div class="label l4">❌ پوچ</div>
<div class="label l5">🪙 ۲۰</div>
<div class="label l6">🪙 ۳۰</div>
<div class="label l7">❌ پوچ</div>
<div class="label l8">🪙 ۵۰</div>
<div class="label l9">🪙 ۱۰۰</div>
<div class="label l10">🥇 ۵۰۰</div>
</div>
<div class="center">
🎁
</div>
</div>
<button
class="spin"
id="spinButton"
onclick="spin()">
🎡 چرخاندن گردونه
</button>
<div class="result" id="result">
جایزه‌ات را امتحان کن! 🎁
</div>
<div class="prizes">
<h3>
🎁 جوایز گردونه
</h3>
❌ پوچ: ۳ قسمت<br>
🪙 ۱۰ سکه<br>
🪙 ۱۵ سکه<br>
🪙 ۲۰ سکه<br>
🪙 ۳۰ سکه<br>
🪙 ۵۰ سکه<br>
🪙 ۱۰۰ سکه<br>
<span class="gold">
🥇 ۵۰۰ سکه طلایی — شانس ۱٪
</span>
</div>
</section>
<a class="back" href="coin.html">
⬅️ برگشت به مرکز سرگرمی
</a>
<script>

/* =========================
   سکه مشترک
========================= */

let coins =
Number(
    localStorage.getItem(
        "gamimodCoins"
    )
) || 0;


function updateCoins(){

    document.getElementById(
        "coins"
    ).innerHTML =
    coins + " 🪙";

}


function saveCoins(){

    localStorage.setItem(
        "gamimodCoins",
        coins
    );

    updateCoins();

}


updateCoins();


/* =========================
   گردونه
========================= */

let spinning = false;

let rotation = 0;


function spin(){

    if(spinning){

        return;

    }

    spinning = true;

    document.getElementById(
        "spinButton"
    ).disabled = true;


    /*
       شانس واقعی جایزه طلایی:
       ۱ درصد
    */

    let random =
    Math.random() * 100;

    let prize;


    if(random < 1){

        prize = 500;

    }

    else{

        const normalPrizes = [

            0,
            10,
            15,
            0,
            20,
            30,
            0,
            50,
            100

        ];

        prize =
        normalPrizes[
            Math.floor(
                Math.random() *
                normalPrizes.length
            )
        ];

    }


    /*
       چرخش نمایشی
    */

    let extra =
    1440 +
    Math.floor(
        Math.random() * 1080
    );


    rotation += extra;


    document.getElementById(
        "wheel"
    ).style.transform =
    "rotate(" +
    rotation +
    "deg)";


    setTimeout(function(){

        if(prize === 500){

            coins += 500;

            saveCoins();

            document.getElementById(
                "result"
            ).innerHTML =
            "🥇🎉 فوق‌العاده!<br>" +
            "سکه طلایی ۵۰۰ تایی بردی!<br>" +
            "+500 🪙";

        }

        else if(prize === 0){

            document.getElementById(
                "result"
            ).innerHTML =
            "❌ این بار پوچ شد!<br>" +
            "دوباره امتحان کن.";

        }

        else{

            coins += prize;

            saveCoins();

            document.getElementById(
                "result"
            ).innerHTML =
            "🎉 تبریک!<br>" +
            "جایزه تو: " +
            prize +
            " 🪙";

        }


        spinning = false;

        document.getElementById(
            "spinButton"
        ).disabled = false;


    },4200);

}

</script>
</body>
</html>
