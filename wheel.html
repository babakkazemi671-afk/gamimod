<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎡 گردونه سکه | گیمی‌مود</title>
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:tahoma;
    background:#101010;
    color:white;
    text-align:center;
}

header{
    background:#00bcd4;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.balance{
    margin:20px;
    padding:20px;
    background:linear-gradient(135deg,#302b63,#24243e);
    border-radius:20px;
}

.coins{
    font-size:32px;
    font-weight:bold;
}

.game{
    width:94%;
    max-width:650px;
    margin:20px auto;
    padding:25px 15px;
    background:#202020;
    border-radius:20px;
    box-shadow:0 0 15px #000;
}

.wheel-wrap{
    position:relative;
    width:330px;
    max-width:90vw;
    height:330px;
    margin:25px auto;
}

.wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid white;
    position:relative;
    overflow:hidden;
    transition:transform 4s cubic-bezier(.12,.8,.18,1);
    background:
    conic-gradient(
        #555 0deg 36deg,
        #00bcd4 36deg 72deg,
        #555 72deg 108deg,
        #00bcd4 108deg 144deg,
        #555 144deg 180deg,
        #00bcd4 180deg 216deg,
        #00bcd4 216deg 252deg,
        #00bcd4 252deg 288deg,
        #00bcd4 288deg 324deg,
        #00bcd4 324deg 360deg
    );
    box-shadow:0 0 20px #000;
}

.label{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    font-weight:bold;
    font-size:16px;
}

.label span{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:0 0;
    width:120px;
    margin-left:-60px;
    margin-top:-10px;
}

.l1{transform:rotate(18deg) translateY(-135px);}
.l2{transform:rotate(54deg) translateY(-135px);}
.l3{transform:rotate(90deg) translateY(-135px);}
.l4{transform:rotate(126deg) translateY(-135px);}
.l5{transform:rotate(162deg) translateY(-135px);}
.l6{transform:rotate(198deg) translateY(-135px);}
.l7{transform:rotate(234deg) translateY(-135px);}
.l8{transform:rotate(270deg) translateY(-135px);}
.l9{transform:rotate(306deg) translateY(-135px);}
.l10{transform:rotate(342deg) translateY(-135px);}

.pointer{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    font-size:38px;
}

.spin{
    padding:15px 35px;
    border:0;
    border-radius:12px;
    background:#00bcd4;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

.spin:disabled{
    background:#555;
    cursor:not-allowed;
}

.prizes{
    margin:20px auto;
    max-width:500px;
    padding:18px;
    background:#151515;
    border-radius:14px;
    line-height:2;
}

.gold{
    color:#ffd700;
    font-weight:bold;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#151515;
    border-radius:12px;
    line-height:2;
}

.back{
    display:block;
    width:230px;
    margin:25px auto;
    padding:14px;
    background:#333;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
}

</style>
</head>
<body>
<header>
🎡 گردونه سکه گیمی‌مود
</header>
<section class="balance">
<h2>🐷 موجودی قلک</h2>
<div class="coins" id="coins">
0 🪙
</div>
</section>
<section class="game">
<h2>🎁 جایزه‌های گردونه</h2>
<div class="prizes">
❌ پوچ — ۳ قسمت<br>
🪙 ۱۰ سکه<br>
🪙 ۱۵ سکه<br>
🪙 ۲۰ سکه<br>
🪙 ۳۰ سکه<br>
<span class="gold">👑 سکه طلایی — ۵۰۰ سکه | شانس ویژه ۱٪</span>
</div>
<div class="wheel-wrap">
<div class="pointer">
▼
</div>
<div class="wheel" id="wheel">
<div class="label">
<span class="l1">❌ پوچ</span>
<span class="l2">🪙 ۱۰</span>
<span class="l3">❌ پوچ</span>
<span class="l4">🪙 ۱۵</span>
<span class="l5">❌ پوچ</span>
<span class="l6">🪙 ۲۰</span>
<span class="l7">🪙 ۳۰</span>
<span class="l8">🪙 ۱۰</span>
<span class="l9">🪙 ۱۵</span>
<span class="l10">🪙 ۲۰</span>
</div>
</div>
</div>
<button
class="spin"
id="spinButton"
onclick="spinWheel()">
🎡 چرخاندن گردونه
</button>
<div class="result" id="result">
گردونه را بچرخان و جایزه بگیر! 🎁
</div>
</section>
<a class="back" href="coin.html">
⬅️ برگشت به مرکز سرگرمی
</a>
<script>

/* =========================
   سکه مشترک
========================= */

let coins =
Number(localStorage.getItem("gamimodCoins")) || 0;


function updateCoins(){

    document.getElementById(
        "coins"
    ).innerHTML =
    coins + " 🪙";

}


function saveCoins(){

    localStorage.setItem(
        "gamimodCoins",
        coins
    );

    updateCoins();

}


updateCoins();


/* =========================
   گردونه
========================= */

let spinning = false;


/* =========================
   چرخاندن
========================= */

function spinWheel(){

    if(spinning){

        return;

    }


    spinning = true;


    document.getElementById(
        "spinButton"
    ).disabled = true;


    /*
       جایزه طلایی:
       فقط ۱٪ احتمال
    */

    let gold =
    Math.random() < 0.01;


    let reward;


    if(gold){

        reward = 500;

    }

    else{

        /*
           ۱۰ بخش اصلی:

           ۳ پوچ
           ۲ × ۱۰
           ۲ × ۱۵
           ۲ × ۲۰
           ۱ × ۳۰
        */

        const prizes = [
            0,
            10,
            0,
            15,
            0,
            20,
            30,
            10,
            15,
            20
        ];


        reward =
        prizes[
            Math.floor(
                Math.random() *
                prizes.length
            )
        ];

    }


    /*
       چرخش نمایشی
    */

    const wheel =
    document.getElementById(
        "wheel"
    );


    const rotation =
    1440 +
    Math.floor(
        Math.random() * 360
    );


    wheel.style.transform =
    "rotate(" +
    rotation +
    "deg)";


    setTimeout(
    function(){

        if(reward === 0){

            document.getElementById(
                "result"
            ).innerHTML =
            "❌ پوچ شد!<br>" +
            "این بار سکه‌ای نگرفتی.";

        }

        else if(reward === 500){

            coins += 500;

            saveCoins();


            document.getElementById(
                "result"
            ).innerHTML =
            "👑🔥 سکه طلایی!<br>" +
            "+500 🪙<br>" +
            "شانس این جایزه: ۱٪";

        }

        else{

            coins += reward;

            saveCoins();


            document.getElementById(
                "result"
            ).innerHTML =
            "🎉 برنده شدی!<br>" +
            "+ " +
            reward +
            " 🪙";

        }


        spinning = false;


        document.getElementById(
            "spinButton"
        ).disabled = false;


    },4200);

}

</script>
</body>

</html>
