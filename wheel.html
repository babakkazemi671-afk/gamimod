<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎡 گردونه شانس | گیمی مود</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:#fff;
text-align:center
}

header{
background:linear-gradient(135deg,#f39c12,#c0392b);
padding:18px;
font-size:24px;
font-weight:bold
}

.container{
width:94%;
max-width:650px;
margin:20px auto
}

.card{
background:#1d1d1d;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px #0008
}

.wheelBox{
position:relative;
width:320px;
height:320px;
margin:20px auto
}

#wheel{
width:320px;
height:320px;
border-radius:50%;
border:8px solid #fff;
background:conic-gradient(
#e74c3c 0deg 45deg,
#3498db 45deg 90deg,
#2ecc71 90deg 135deg,
#9b59b6 135deg 180deg,
#f1c40f 180deg 225deg,
#e67e22 225deg 270deg,
#1abc9c 270deg 315deg,
#34495e 315deg 360deg
);
transition:transform 4s cubic-bezier(.17,.67,.12,1)
}

.pointer{
position:absolute;
top:-5px;
left:50%;
transform:translateX(-50%);
width:0;
height:0;
border-left:17px solid transparent;
border-right:17px solid transparent;
border-top:35px solid #fff;
z-index:5
}

.center{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:65px;
height:65px;
background:#111;
border:5px solid #fff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
z-index:4
}

button{
border:0;
border-radius:13px;
padding:14px 25px;
font-family:tahoma;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:#fff
}

.spin{
background:#e67e22;
width:90%;
max-width:350px
}

.spin:disabled{
background:#555;
cursor:not-allowed
}

.reward{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#ffd700;
line-height:2
}

.timer{
margin-top:10px;
font-size:17px;
color:#00e5ff
}

.back{
display:block;
margin:20px auto 0;
background:#333;
color:#fff;
text-decoration:none;
padding:13px;
border-radius:12px;
max-width:230px
}

.small{
font-size:13px;
color:#aaa;
line-height:1.8
}

.zidane{
margin-top:18px;
padding:12px;
border-radius:12px;
background:#241b00;
border:1px solid #d4af37;
color:#ffd700;
line-height:2
}
</style>
</head>
<body>
<header>
🎡 گردونه شانس گیمی مود
</header>
<div class="container">
<div class="card">
<p>
هر ۲۴ ساعت فقط یک بار می‌توانی گردونه را بچرخانی.
</p>
<div class="wheelBox">
<div class="pointer"></div>
<div id="wheel"></div>
<div class="center">🎡</div>
</div>
<button
id="spinButton"
class="spin"
onclick="spinWheel()">
🎡 چرخاندن گردونه
</button>
<div id="reward" class="reward">
گردونه آماده است!
</div>
<div id="timer" class="timer"></div>
<div class="zidane">
⭐ جایزه فوق‌نادر ⭐<br>
زیدان — قدرت ۱۲۰<br>
شانس دریافت: ۰٫۱٪
</div>
<p class="small">
زیدان بسیار نادر است و در صورت برد، به‌صورت خودکار وارد «تیم من» می‌شود.
</p>
</div>
<a class="back" href="index.html">
⬅️ برگشت به خانه
</a>
</div>
<script>

const DAY = 24 * 60 * 60 * 1000;

let lastSpin =
Number(localStorage.getItem("lastWheelSpin")) || 0;

let rotation =
Number(localStorage.getItem("wheelRotation")) || 0;


/*
=====================================
 بررسی امکان چرخش
=====================================
*/

function canSpin(){

return Date.now() - lastSpin >= DAY;

}


/*
=====================================
 انتخاب جایزه
=====================================

زیدان:
۱ از ۱۰۰۰ = ۰٫۱٪

بقیه ۹۹۹ از ۱۰۰۰
*/

function chooseReward(){

let random =
Math.floor(Math.random() * 1000);

if(random === 0){

return {
type:"zidane",
name:"⭐ زیدان",
power:120
};

}


/*
بقیه جایزه‌ها
*/

const normalRewards=[

{
type:"coins",
name:"🪙 100 سکه",
coins:100
},

{
type:"diamonds",
name:"💎 5 الماس",
diamonds:5
},

{
type:"coins",
name:"🪙 250 سکه",
coins:250
},

{
type:"pack",
name:"🎁 پک فوتبال",
coins:150,
diamonds:2
},

{
type:"diamonds",
name:"💎 10 الماس",
diamonds:10
},

{
type:"coins",
name:"🪙 500 سکه",
coins:500
},

{
type:"special",
name:"🎁 جایزه ویژه",
coins:750,
diamonds:15
},

{
type:"diamonds",
name:"💎 3 الماس",
diamonds:3
}

];

return normalRewards[
Math.floor(
Math.random()*normalRewards.length
)
];

}


/*
=====================================
 ذخیره بازیکن در تیم من
=====================================
*/

function addZidane(){

let team=[];

try{

team=
JSON.parse(
localStorage.getItem("myteam")
)||[];

}catch(e){

team=[];

}


/*
جلوگیری از دوبار اضافه شدن زیدان
*/

let exists=
team.some(
player =>
player.name==="زیدان"
);


if(!exists){

team.push({

name:"زیدان",

power:120,

type:"legendary",

source:"wheel",

date:Date.now()

});

localStorage.setItem(
"myteam",
JSON.stringify(team)
);

return true;

}

return false;

}


/*
=====================================
 اعمال جایزه
=====================================
*/

function applyReward(reward){

if(reward.type==="zidane"){

let added=addZidane();

if(added){

document.getElementById(
"reward"
).innerHTML=
"🎉🎉 فوق‌العاده!<br>"+
"⭐ زیدان به تیم من اضافه شد!<br>"+
"⚡ قدرت: ۱۲۰";

}else{

document.getElementById(
"reward"
).innerHTML=
"⭐ زیدان را قبلاً داری!";

}

return;

}


/*
سکه
*/

let coins=
Number(
localStorage.getItem("coins")
)||0;

if(reward.coins){

coins+=reward.coins;

localStorage.setItem(
"coins",
coins
);

}


/*
الماس
*/

let diamonds=
Number(
localStorage.getItem("diamonds")
)||0;

if(reward.diamonds){

diamonds+=reward.diamonds;

localStorage.setItem(
"diamonds",
diamonds
);

}


document.getElementById(
"reward"
).innerHTML=
"🎉 جایزه تو: "+
reward.name+
"<br>🪙 سکه: "+
coins+
" | 💎 الماس: "+
diamonds;

}


/*
=====================================
 چرخاندن گردونه
=====================================
*/

function spinWheel(){

if(!canSpin()){

updateStatus();

return;

}


/*
زمان استفاده بعدی
*/

lastSpin=Date.now();

localStorage.setItem(
"lastWheelSpin",
lastSpin
);


/*
انتخاب جایزه
*/

const reward=
chooseReward();


/*
چرخش ظاهری
*/

const extra=
360*6;

rotation+=
extra+
360;

document.getElementById(
"wheel"
).style.transform=
"rotate("+rotation+"deg)";


document.getElementById(
"spinButton"
).disabled=true;

document.getElementById(
"reward"
).innerHTML=
"🎡 گردونه در حال چرخیدن است...";


document.getElementById(
"timer"
).innerHTML=
"⏳ در حال مشخص شدن جایزه...";


setTimeout(
function(){

applyReward(reward);

updateStatus();

},
4200
);

}


/*
=====================================
 وضعیت
=====================================
*/

function updateStatus(){

if(canSpin()){

document.getElementById(
"spinButton"
).disabled=false;

document.getElementById(
"timer"
).innerHTML=
"✅ آماده چرخاندن";

return;

}

document.getElementById(
"spinButton"
).disabled=true;

updateTimer();

}


/*
=====================================
 شمارش معکوس
=====================================
*/

function updateTimer(){

if(canSpin()){

updateStatus();

return;

}

let remaining=
DAY-
(Date.now()-lastSpin);

let hours=
Math.floor(
remaining/(60*60*1000)
);

let minutes=
Math.floor(
(remaining/(60*1000))%60
);

let seconds=
Math.floor(
(remaining/1000)%60
);

document.getElementById(
"timer"
).innerHTML=
"⏳ چرخش بعدی: "+
String(hours).padStart(2,"0")+
":"+
String(minutes).padStart(2,"0")+
":"+
String(seconds).padStart(2,"0");

}


/*
=====================================
 اجرا
=====================================
*/

updateStatus();

setInterval(
updateTimer,
1000
);

</script>
</body>
</html>
