<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛒 فروشگاه | GAMIMOD</title>
<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:tahoma;
background:#0b0b0f;
color:white;
padding-bottom:30px;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:25px 15px;
text-align:center;
}

header h1{
margin:0 0 8px;
font-size:28px;
}

header p{
margin:0;
color:#dffaff;
}

.wallet{
width:94%;
max-width:900px;
margin:18px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.money{
background:#1c1c22;
padding:17px;
border-radius:16px;
text-align:center;
font-size:19px;
box-shadow:0 4px 12px #000;
}

.coins{
color:#ffd700;
}

.diamonds{
color:#55ddff;
}

.filters{
width:94%;
max-width:1100px;
margin:15px auto;
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:center;
}

.filter{
border:0;
padding:11px 16px;
border-radius:12px;
background:#25252d;
color:white;
font-family:tahoma;
font-weight:bold;
cursor:pointer;
}

.filter.active{
background:#00bcd4;
}

.grid{
width:94%;
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(210px,1fr));
gap:15px;
}

.card{
background:#181820;
border-radius:18px;
padding:17px;
box-shadow:0 5px 15px #000;
text-align:center;
transition:.2s;
border:1px solid #292930;
}

.card:hover{
transform:translateY(-3px);
}

.preview{
height:105px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:48px;
margin-bottom:12px;
background:linear-gradient(135deg,#252535,#101018);
}

.name{
font-size:17px;
font-weight:bold;
margin-bottom:7px;
}

.category{
font-size:13px;
color:#aaa;
margin-bottom:8px;
}

.price{
font-size:17px;
font-weight:bold;
margin:12px 0;
}

.coinPrice{
color:#ffd700;
}

.diamondPrice{
color:#55ddff;
}

.buy{
width:100%;
border:0;
padding:11px;
border-radius:11px;
font-family:tahoma;
font-weight:bold;
cursor:pointer;
background:#00bcd4;
color:white;
}

.buy:hover{
background:#00e5ff;
}

.buy.owned{
background:#444;
cursor:not-allowed;
}

.activeItem{
border:2px solid #00e5ff;
}

.notice{
width:94%;
max-width:700px;
margin:18px auto;
padding:15px;
background:#15151b;
border-radius:14px;
text-align:center;
color:#ddd;
line-height:1.8;
}

.back{
display:block;
width:230px;
margin:25px auto;
padding:14px;
background:#333;
color:white;
text-decoration:none;
border-radius:12px;
text-align:center;
font-weight:bold;
}

@media(max-width:550px){

.wallet{
grid-template-columns:1fr;
}

.grid{
grid-template-columns:
repeat(2,1fr);
gap:10px;
}

.card{
padding:12px;
}

.preview{
height:85px;
font-size:38px;
}

.name{
font-size:14px;
}

}

</style>
</head>
<body>
<header>
<h1>🛒 فروشگاه GAMIMOD</h1>
<p>
۱۲۰ آیتم برای شخصی‌سازی پروفایل و ظاهر بازی
</p>
</header>
<div class="wallet">
<div class="money coins">
💰 سکه:
<span id="coins">0</span>
</div>
<div class="money diamonds">
💎 الماس:
<span id="diamonds">0</span>
</div>
</div>
<div class="notice">
✨ آیتم‌های خریداری‌شده ذخیره می‌شوند و می‌توانی آن‌ها را برای پروفایلت فعال کنی.
</div>
<div class="filters">
<button class="filter active" onclick="setFilter('all',this)">
🌟 همه
</button>
<button class="filter" onclick="setFilter('theme',this)">
🎨 تم‌ها
</button>
<button class="filter" onclick="setFilter('background',this)">
🖼️ پس‌زمینه
</button>
<button class="filter" onclick="setFilter('frame',this)">
🖼️ قاب عکس
</button>
<button class="filter" onclick="setFilter('avatar',this)">
👤 آواتار
</button>
<button class="filter" onclick="setFilter('special',this)">
💎 ویژه
</button>
</div>
<div class="grid" id="shop"></div>
<a class="back" href="index.html">
⬅️ برگشت به خانه
</a>
<script>

/* =========================
   پول
========================= */

let coins =
Number(localStorage.getItem("coins"));

if(!Number.isFinite(coins)){

coins=30000;

localStorage.setItem("coins",coins);

}


let diamonds =
Number(localStorage.getItem("diamonds"));

if(!Number.isFinite(diamonds)){

diamonds=0;

localStorage.setItem("diamonds",diamonds);

}


/* =========================
   آیتم‌ها
========================= */

const items=[];


/* =========================
   ۳۰ تم
========================= */

const themes=[
"تم آبی",
"تم قرمز",
"تم سبز",
"تم بنفش",
"تم طلایی",
"تم نارنجی",
"تم صورتی",
"تم آسمانی",
"تم شب",
"تم نئون",
"تم آتشی",
"تم یخی",
"تم جنگل",
"تم اقیانوس",
"تم کهکشانی",
"تم الماسی",
"تم مشکی",
"تم سفید",
"تم سایبری",
"تم گیمینگ",
"تم رعد",
"تم آذرخش",
"تم لاوا",
"تم زمرد",
"تم یاقوت",
"تم بنفش سلطنتی",
"تم طلوع",
"تم غروب",
"تم فضایی",
"تم آینده"
];

themes.forEach((name,i)=>{

items.push({

id:"theme_"+i,

name:"🎨 "+name,

category:"theme",

categoryName:"تم و ظاهر",

icon:"🎨",

price:1000+i*250,

currency:"coins"

});

});


/* =========================
   ۲۵ پس‌زمینه
========================= */

const backgrounds=[
"پس‌زمینه شب",
"پس‌زمینه شهر",
"پس‌زمینه استادیوم",
"پس‌زمینه فوتبال",
"پس‌زمینه آتش",
"پس‌زمینه یخ",
"پس‌زمینه جنگل",
"پس‌زمینه دریا",
"پس‌زمینه کوهستان",
"پس‌زمینه فضا",
"پس‌زمینه کهکشان",
"پس‌زمینه نئون",
"پس‌زمینه سایبری",
"پس‌زمینه طلایی",
"پس‌زمینه الماسی",
"پس‌زمینه رعدوبرق",
"پس‌زمینه غروب",
"پس‌زمینه طلوع",
"پس‌زمینه بارانی",
"پس‌زمینه برفی",
"پس‌زمینه قرمز",
"پس‌زمینه آبی",
"پس‌زمینه بنفش",
"پس‌زمینه سبز",
"پس‌زمینه مشکی"
];

backgrounds.forEach((name,i)=>{

items.push({

id:"bg_"+i,

name:"🖼️ "+name,

category:"background",

categoryName:"پس‌زمینه پروفایل",

icon:"🌌",

price:1500+i*300,

currency:"coins"

});

});


/* =========================
   ۲۵ قاب
========================= */

const frames=[
"قاب آبی",
"قاب قرمز",
"قاب سبز",
"قاب بنفش",
"قاب طلایی",
"قاب نقره‌ای",
"قاب نارنجی",
"قاب صورتی",
"قاب آتشی",
"قاب یخی",
"قاب نئون",
"قاب رعد",
"قاب زمرد",
"قاب یاقوت",
"قاب الماسی",
"قاب سلطنتی",
"قاب ستاره‌ای",
"قاب کهکشانی",
"قاب سایبری",
"قاب گیمینگ",
"قاب فوتبال",
"قاب قهرمانی",
"قاب افسانه‌ای",
"قاب شاهانه",
"قاب اسطوره‌ای"
];

frames.forEach((name,i)=>{

items.push({

id:"frame_"+i,

name:"🖼️ "+name,

category:"frame",

categoryName:"قاب عکس",

icon:"⭕",

price:2000+i*400,

currency:"coins"

});

});


/* =========================
   ۱۵ آواتار
========================= */

const avatars=[
"آواتار جنگجو",
"آواتار فوتبالیست",
"آواتار گیمر",
"آواتار نینجا",
"آواتار ربات",
"آواتار فضایی",
"آواتار آتش",
"آواتار یخ",
"آواتار رعد",
"آواتار شاه",
"آواتار قهرمان",
"آواتار سایبری",
"آواتار طلایی",
"آواتار الماسی",
"آواتار افسانه‌ای"
];

avatars.forEach((name,i)=>{

items.push({

id:"avatar_"+i,

name:"👤 "+name,

category:"avatar",

categoryName:"آواتار",

icon:"😎",

price:2500+i*500,

currency:"coins"

});

});


/* =========================
   ۲۵ آیتم ویژه الماسی
========================= */

const special=[
"قاب الماس آبی",
"قاب الماس قرمز",
"قاب الماس طلایی",
"قاب الماس بنفش",
"قاب الماس سبز",
"پس‌زمینه الماس آبی",
"پس‌زمینه الماس قرمز",
"پس‌زمینه الماس طلایی",
"پس‌زمینه کهکشان الماسی",
"تم الماس نئون",
"تم الماس آتش",
"تم الماس یخ",
"آواتار الماس",
"آواتار پادشاه",
"آواتار اسطوره",
"قاب فوق‌العاده",
"قاب اژدها",
"قاب رعد طلایی",
"قاب ستاره‌ای الماسی",
"پس‌زمینه افسانه‌ای",
"تم افسانه‌ای",
"تم قهرمانی",
"تم شاهانه",
"آواتار افسانه‌ای",
"پک کامل الماسی"
];

special.forEach((name,i)=>{

items.push({

id:"special_"+i,

name:"💎 "+name,

category:"special",

categoryName:"ویژه الماسی",

icon:"💎",

price:5+i,

currency:"diamonds"

});

});


/* =========================
   بررسی تعداد
========================= */

console.log(
"تعداد آیتم‌ها:",
items.length
);


/* =========================
   خریداری شده‌ها
========================= */

let owned =
JSON.parse(
localStorage.getItem("shopItems")
) || [];


/* =========================
   فیلتر
========================= */

let filter="all";


function setFilter(type,button){

filter=type;

document
.querySelectorAll(".filter")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");

renderShop();

}


/* =========================
   کیف پول
========================= */

function updateWallet(){

document.getElementById("coins")
.textContent=
coins.toLocaleString("fa-IR");

document.getElementById("diamonds")
.textContent=
diamonds.toLocaleString("fa-IR");

}


/* =========================
   خرید
========================= */

function buyItem(id){

const item=
items.find(
x=>x.id===id
);

if(!item)return;


if(owned.includes(id)){

alert("✅ این آیتم را قبلاً خریدی!");

return;

}


if(item.currency==="coins"){

if(coins<item.price){

alert("❌ سکه کافی نداری!");

return;

}

coins-=item.price;

localStorage.setItem(
"coins",
coins
);

}


if(item.currency==="diamonds"){

if(diamonds<item.price){

alert("💎 الماس کافی نداری!");

return;

}

diamonds-=item.price;

localStorage.setItem(
"diamonds",
diamonds
);

}


owned.push(id);

localStorage.setItem(
"shopItems",
JSON.stringify(owned)
);


/* اعمال خودکار آیتم */

applyItem(item);


updateWallet();

renderShop();


alert(
"🎉 "+item.name+
" خریداری شد و اعمال شد!"
);

}


/* =========================
   اعمال آیتم
========================= */

function applyItem(item){

if(item.category==="theme"){

localStorage.setItem(
"activeTheme",
item.id
);

}


if(item.category==="background"){

localStorage.setItem(
"activeBackground",
item.id
);

}


if(item.category==="frame"){

localStorage.setItem(
"activeFrame",
item.id
);

}


if(item.category==="avatar"){

localStorage.setItem(
"activeAvatar",
item.id
);

}


if(item.category==="special"){

localStorage.setItem(
"activeSpecial",
item.id
);

}

}


/* =========================
   نمایش فروشگاه
========================= */

function renderShop(){

const shop=
document.getElementById("shop");

shop.innerHTML="";


let list=
items.filter(item=>{

return filter==="all"
||
item.category===filter;

});


list.forEach(item=>{

const isOwned=
owned.includes(item.id);


const card=
document.createElement("div");

card.className="card";


let priceText=
item.price.toLocaleString("fa-IR");


let priceClass=
item.currency==="diamonds"
? "diamondPrice"
: "coinPrice";


let currency=
item.currency==="diamonds"
? "💎"
: "💰";


card.innerHTML=

'<div class="preview">'+
item.icon+
'</div>'+

'<div class="name">'+
item.name+
'</div>'+

'<div class="category">'+
item.categoryName+
'</div>'+

'<div class="price '+priceClass+'">'+
currency+" "+priceText+
'</div>'+

'<button class="buy">'+
(
isOwned
? "✅ خریداری شده"
: "🛒 خرید"
)+
'</button>';


const button=
card.querySelector(".buy");


if(isOwned){

button.disabled=true;

button.classList.add("owned");

}
else{

button.onclick=
function(){

buyItem(item.id);

};

}


shop.appendChild(card);

});

}


/* =========================
   شروع
========================= */

updateWallet();

renderShop();

</script>
</body>
</html>
