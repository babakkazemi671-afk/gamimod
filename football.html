<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ بازی فوتبال | گیمی‌مود</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:white;
text-align:center;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:16px;
font-size:24px;
font-weight:bold;
}

.game{
width:96%;
max-width:1050px;
margin:15px auto;
background:#202020;
padding:14px;
border-radius:20px;
}

.score{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:10px;
font-size:18px;
font-weight:bold;
margin-bottom:12px;
}

.home{
color:#ff4040;
}

.away{
color:#fff;
}

.minute{
color:#00e5ff;
font-size:20px;
}

.field{
position:relative;
width:100%;
height:560px;
overflow:hidden;
border:5px solid white;
border-radius:14px;

background:
repeating-linear-gradient(
90deg,
#147636 0,
#147636 70px,
#18813b 70px,
#18813b 140px
);
}

.centerLine{
position:absolute;
left:50%;
top:0;
height:100%;
width:3px;
background:white;
}

.centerCircle{
position:absolute;
left:50%;
top:50%;
width:120px;
height:120px;
border:3px solid white;
border-radius:50%;
transform:translate(-50%,-50%);
}

.penalty{
position:absolute;
top:30%;
height:40%;
width:105px;
border:3px solid white;
}

.penalty.left{
left:-3px;
border-left:0;
}

.penalty.right{
right:-3px;
border-right:0;
}

.goal{
position:absolute;
top:39%;
height:120px;
width:30px;
border:5px solid white;
z-index:2;
}

.goal.left{
left:-5px;
}

.goal.right{
right:-5px;
}

.defenceLine{
position:absolute;
top:0;
height:100%;
width:3px;
border-left:2px dashed rgba(255,255,255,.45);
z-index:1;
}

.redLine{
left:43%;
}

.whiteLine{
left:57%;
}

.player{
position:absolute;
width:40px;
height:40px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:bold;
text-align:center;
padding:3px;
z-index:5;

transition:
left .18s linear,
top .18s linear;
}

.red{
background:#d71920;
border:2px solid white;
color:white;
}

.white{
background:#eee;
border:2px solid #111;
color:#111;
}

.gk{
box-shadow:0 0 0 3px #ffd700;
}

.ball{
position:absolute;
width:18px;
height:18px;
background:white;
border:2px solid #111;
border-radius:50%;
z-index:8;

transition:
left .12s linear,
top .12s linear;
}

.controls{
margin-top:14px;
}

button{
border:0;
border-radius:12px;
padding:11px 18px;
margin:4px;
font-family:tahoma;
font-weight:bold;
cursor:pointer;
color:white;
}

.start{
background:#00bcd4;
}

.attack{
background:#e67e22;
}

.defend{
background:#8e44ad;
}

button:disabled{
background:#555;
}

.log{
margin-top:14px;
height:170px;
overflow:auto;
background:#151515;
padding:12px;
border-radius:12px;
text-align:right;
line-height:1.9;
}

.result{
margin-top:12px;
padding:14px;
background:#151515;
border-radius:12px;
line-height:2;
}

.back{
display:block;
width:230px;
margin:22px auto;
padding:13px;
background:#333;
color:white;
text-decoration:none;
border-radius:12px;
}

.goalText{
font-size:23px;
color:#ffd700;
}

</style>
</head>
<body>
<header>
⚽ بازی فوتبال گیمی‌مود
</header>
<div class="game">
<div class="score">
<div class="home">
<span id="homeName">تیم من</span>
<br>
<span id="homeScore">0</span>
</div>
<div class="minute">
دقیقه
<span id="minute">1</span>
</div>
<div class="away">
<span id="awayName">حریف</span>
<br>
<span id="awayScore">0</span>
</div>
</div>
<div class="field">
<div class="centerLine"></div>
<div class="centerCircle"></div>
<div class="penalty left"></div>
<div class="penalty right"></div>
<div class="goal left"></div>
<div class="goal right"></div>
<div class="defenceLine redLine"></div>
<div class="defenceLine whiteLine"></div>
<div id="homePlayers"></div>
<div id="awayPlayers"></div>
<div class="ball" id="ball"></div>
</div>
<div class="controls">
<button
class="start"
id="startButton"
onclick="startMatch()">
▶️ شروع مسابقه
</button>
<br>
<button
class="attack"
onclick="setTactic('attack')">
🔥 هجومی
</button>
<button
class="defend"
onclick="setTactic('defend')">
🛡️ دفاعی
</button>
</div>
<div
class="log"
id="log">
🏟️ آماده شروع مسابقه...
</div>
<div
class="result"
id="result">
ترکیب ذخیره‌شده تیم آماده است.
</div>
</div>
<a
class="back"
href="myteam.html">
⬅️ برگشت به تیم من
</a>
<script>

/* =================================
   اطلاعات تیم
================================= */

let savedLineup=
JSON.parse(
localStorage.getItem("lineup")
) || {};

let formation=
localStorage.getItem("formation")
||"4-3-3";


let myPlayers=
Object.values(savedLineup);


/* نام باشگاه */

let clubName=
localStorage.getItem("clubName")
||"تیم من";

let opponent=
localStorage.getItem("leagueOpponent")
||"حریف";


document.getElementById(
"homeName"
).innerHTML=clubName;

document.getElementById(
"awayName"
).innerHTML=opponent;


/* =================================
   آرایش‌ها
================================= */

const formations={

"4-3-3":[
[8,50],
[24,18],
[22,40],
[22,60],
[24,82],
[40,25],
[40,50],
[40,75],
[63,25],
[68,50],
[63,75]
],

"4-4-2":[
[8,50],
[24,18],
[22,40],
[22,60],
[24,82],
[40,18],
[40,40],
[40,60],
[40,82],
[67,40],
[67,60]
],

"3-4-3":[
[8,50],
[24,25],
[22,50],
[24,75],
[40,18],
[40,40],
[40,60],
[40,82],
[67,25],
[70,50],
[67,75]
],

"5-3-2":[
[8,50],
[23,12],
[20,32],
[20,50],
[20,68],
[23,88],
[40,25],
[40,50],
[40,75],
[67,40],
[67,60]
],

"3-5-2":[
[8,50],
[24,25],
[22,50],
[24,75],
[40,12],
[40,30],
[40,50],
[40,70],
[40,88],
[67,40],
[67,60]
]

};


/* =================================
   بازیکنان تیم ما
================================= */

let homePlayers=[];

for(
let i=0;
i<11;
i++
){

let player=
myPlayers[i];

if(!player){

player={
name:"بازیکن "+(i+1),
power:60,
position:
i===0
?"GK"
:
i<5
?"DEF"
:
i<8
?"MID"
:
"ATT"
};

}

homePlayers.push({

number:i+1,
name:player.name,
power:Number(player.power)||60,
position:player.position

});

}


/* =================================
   بازیکنان حریف
================================= */

const opponentNames=[

"مهاجم حریف",
"مدافع راست",
"مدافع چپ",
"مدافع وسط",
"کاپیتان",
"هافبک",
"هافبک مرکزی",
"وینگر",
"مهاجم",
"مهاجم دوم",
"دروازه‌بان"

];

let awayPlayers=[];

for(
let i=0;
i<11;
i++
){

awayPlayers.push({

number:i+1,

name:
opponentNames[i],

power:
65+(i%20),

position:
i===10
?"GK"
:
i<4
?"DEF"
:
i<7
?"MID"
:
"ATT"

});

}


/* =================================
   موقعیت اولیه
================================= */

function createPlayers(){

let homeBox=
document.getElementById(
"homePlayers"
);

let awayBox=
document.getElementById(
"awayPlayers"
);

homeBox.innerHTML="";
awayBox.innerHTML="";


let spots=
formations[formation]
||formations["4-3-3"];


homePlayers.forEach(
(player,index)=>{

let div=
document.createElement("div");

div.className=
"player red";

if(index===0){

div.classList.add("gk");

}

div.id=
"home_"+player.number;

div.innerHTML=
player.name+
"<br>"+
player.power;

div.style.left=
spots[index][0]+"%";

div.style.top=
spots[index][1]+"%";

homeBox.appendChild(div);

});


awayPlayers.forEach(
(player,index)=>{

let div=
document.createElement("div");

div.className=
"player white";

if(index===10){

div.classList.add("gk");

}

div.id=
"away_"+player.number;

div.innerHTML=
player.name+
"<br>"+
player.power;


/*
 حریف از سمت راست
*/

div.style.left=
(100-spots[index][0])+"%";

div.style.top=
spots[index][1]+"%";

awayBox.appendChild(div);

});

}


createPlayers();


/* =================================
   وضعیت بازی
================================= */

let playing=false;

let minute=1;

let homeScore=0;

let awayScore=0;

let timer=null;

let ballTeam="home";

let ballOwner=9;

let passTarget=null;

let tactic="balanced";

let actionCooldown=0;


/* =================================
   گرفتن موقعیت
================================= */

function getPosition(
team,
number
){

let el=
document.getElementById(
team==="home"
?
"home_"+number
:
"away_"+number
);

return{

x:parseFloat(el.style.left),

y:parseFloat(el.style.top)

};

}


/* =================================
   فاصله
================================= */

function distance(
x1,y1,x2,y2
){

return Math.sqrt(

Math.pow(
x2-x1,
2
)
+
Math.pow(
y2-y1,
2
)

);

}


/* =================================
   توپ
================================= */

function putBall(){

let p=
getPosition(
ballTeam,
ballOwner
);

let ball=
document.getElementById(
"ball"
);

ball.style.left=
(p.x-0.8)+"%";

ball.style.top=
(p.y-1.2)+"%";

}


/* =================================
   شروع
================================= */

function startMatch(){

if(playing)return;

playing=true;

minute=1;

homeScore=0;

awayScore=0;

ballTeam="home";

ballOwner=9;

passTarget=null;

actionCooldown=0;

document.getElementById(
"homeScore"
).innerHTML=0;

document.getElementById(
"awayScore"
).innerHTML=0;

document.getElementById(
"minute"
).innerHTML=1;

document.getElementById(
"startButton"
).disabled=true;

document.getElementById(
"log"
).innerHTML=
"🏟️ سوت شروع مسابقه!<br>"+
"🔴 "+clubName+
" صاحب توپ است.";

document.getElementById(
"result"
).innerHTML=
"⚽ بازی شروع شد.";

putBall();


/*
 هر ۱.۳ ثانیه
 تقریباً یک دقیقه بازی
*/

timer=
setInterval(
gameTick,
1300
);

}


/* =================================
   تیک بازی
================================= */

function gameTick(){

if(!playing)return;

minute++;

document.getElementById(
"minute"
).innerHTML=minute;


if(actionCooldown>0){

actionCooldown--;

}


movePlayers();

if(passTarget!==null){

movePass();

}
else{

putBall();

}


footballDecision();


if(minute>=90){

finishMatch();

}

}


/* =================================
   حرکت بازیکنان
================================= */

function movePlayers(){

for(
let i=1;
i<=11;
i++
){

moveHome(i);

moveAway(i);

}

}


/* =================================
   حرکت تیم خودی
================================= */

function moveHome(number){

let el=
document.getElementById(
"home_"+number
);

let p=
getPosition(
"home",
number
);


/*
 بازیکن صاحب توپ
*/

if(
ballTeam==="home" &&
number===ballOwner &&
passTarget===null
){

/*
 سرعت بیشتر
*/

p.x+=1.6;


/*
 هجومی
*/

if(tactic==="attack"){

p.x+=0.7;

}


/*
 دفاعی
*/

if(tactic==="defend"){

p.x-=0.5;

}

}


/*
 بازیکنان نزدیک توپ
*/

if(
ballTeam==="home" &&
number!==ballOwner &&
Math.random()<0.18
){

let owner=
getPosition(
"home",
ballOwner
);

let d=
distance(
p.x,
p.y,
owner.x,
owner.y
);

if(d<20){

p.x+=
(owner.x-p.x)*0.15;

p.y+=
(owner.y-p.y)*0.15;

}

}


/*
 حرکت طبیعی
*/

if(
number!==ballOwner &&
Math.random()<0.18
){

p.y+=
(Math.random()-0.5)*1.8;

}


/*
 محدودیت دفاعی
*/

let minX=5;

let maxX=88;

if(
number>=2 &&
number<=5
){

maxX=43;

}

if(
number>=6 &&
number<=8
){

maxX=63;

}

if(
number>=9
){

maxX=86;

}


p.x=
Math.max(
minX,
Math.min(
maxX,
p.x
)
);

p.y=
Math.max(
6,
Math.min(
94,
p.y
)
);


el.style.left=
p.x+"%";

el.style.top=
p.y+"%";

}


/* =================================
   حرکت حریف
================================= */

function moveAway(number){

let el=
document.getElementById(
"away_"+number
);

let p=
getPosition(
"away",
number
);


if(
ballTeam==="away" &&
number===ballOwner &&
passTarget===null
){

p.x-=1.6;

if(tactic==="attack"){

p.x-=0.5;

}

}


/*
 دنبال کردن محدود توپ
*/

if(
ballTeam==="away" &&
number!==ballOwner &&
Math.random()<0.18
){

let owner=
getPosition(
"away",
ballOwner
);

let d=
distance(
p.x,
p.y,
owner.x,
owner.y
);

if(d<20){

p.x+=
(owner.x-p.x)*0.15;

p.y+=
(owner.y-p.y)*0.15;

}

}


/*
 حرکت طبیعی
*/

if(
number!==ballOwner &&
Math.random()<0.18
){

p.y+=
(Math.random()-0.5)*1.8;

}


/*
 محدودیت حریف
*/

let minX=12;

let maxX=95;

if(
number>=1 &&
number<=4
){

minX=57;

}

if(
number>=5 &&
number<=7
){

minX=37;

}

if(number>=8){

minX=14;

}


p.x=
Math.max(
minX,
Math.min(
maxX,
p.x
)
);

p.y=
Math.max(
6,
Math.min(
94,
p.y
)
);


el.style.left=
p.x+"%";

el.style.top=
p.y+"%";

}


/* =================================
   پاس
================================= */

function passBall(){

if(actionCooldown>0)return;

let candidates=[];

let owner=
getPosition(
ballTeam,
ballOwner
);

for(
let i=1;
i<=11;
i++
){

if(i===ballOwner)continue;

let p=
getPosition(
ballTeam,
i
);

let d=
distance(
owner.x,
owner.y,
p.x,
p.y
);

if(d<42){

candidates.push({
number:i,
distance:d
});

}

}


if(!candidates.length)return;


candidates.sort(
(a,b)=>
a.distance-b.distance
);


let target=
candidates[
Math.floor(
Math.random()*
Math.min(
3,
candidates.length
)
)
];


passTarget=
target.number;

actionCooldown=2;


addLog(
ballTeam==="home"
?
"🔴 پاس "+
homePlayers[
ballOwner-1
].name
:
"⚪ پاس حریف"
);

}


/* =================================
   حرکت توپ هنگام پاس
================================= */

function movePass(){

let from=
getPosition(
ballTeam,
ballOwner
);

let to=
getPosition(
ballTeam,
passTarget
);

let x=
from.x+
(to.x-from.x)*0.60;

let y=
from.y+
(to.y-from.y)*0.60;


let ball=
document.getElementById(
"ball"
);

ball.style.left=
(x-0.8)+"%";

ball.style.top=
(y-1.2)+"%";


if(
distance(
x,y,
to.x,to.y
)<4
){

ballOwner=
passTarget;

passTarget=null;

}

}


/* =================================
   تصمیم فوتبال
================================= */

function footballDecision(){

if(passTarget!==null)return;

let p=
getPosition(
ballTeam,
ballOwner
);


/*
 پاس
*/

if(
Math.random()<0.32
){

passBall();

return;

}


/*
 شوت تیم خودی
*/

if(
ballTeam==="home" &&
p.x>62 &&
actionCooldown===0
){

shootHome();

return;

}


/*
 شوت حریف
*/

if(
ballTeam==="away" &&
p.x<38 &&
actionCooldown===0
){

shootAway();

return;

}


/*
 توپ‌گیری
*/

if(
Math.random()<0.07
){

changePossession();

}

}


/* =================================
   توپ‌گیری
================================= */

function changePossession(){

let oldTeam=
ballTeam;

let newTeam=
oldTeam==="home"
?
"away"
:
"home";

let oldPos=
getPosition(
oldTeam,
ballOwner
);

let nearest=1;

let best=999;

for(
let i=1;
i<=11;
i++
){

let p=
getPosition(
newTeam,
i
);

let d=
distance(
p.x,
p.y,
oldPos.x,
oldPos.y
);

if(d<best){

best=d;

nearest=i;

}

}


if(best<17){

ballTeam=
newTeam;

ballOwner=
nearest;

passTarget=null;

addLog(
newTeam==="home"
?
"🔴 توپ به "+
clubName+
" رسید!"
:
"⚪ حریف توپ را گرفت!"
);

}

}


/* =================================
   شوت خودی
================================= */

function shootHome(){

if(actionCooldown>0)return;

actionCooldown=5;

let shooter=
homePlayers[
ballOwner-1
];

addLog(
"🔴💥 "+
shooter.name+
" شوت می‌زند!"
);


setTimeout(
function(){

if(!playing)return;

let chance=
0.18+
(shooter.power/100)*0.18;


if(
Math.random()<chance
){

goal(
"home",
shooter.name
);

}
else{

addLog(
"🧤 دروازه‌بان حریف شوت را گرفت."
);

ballTeam="away";

ballOwner=11;

passTarget=null;

putBall();

}

},
350
);

}


/* =================================
   شوت حریف
================================= */

function shootAway(){

if(actionCooldown>0)return;

actionCooldown=5;

let shooter=
awayPlayers[
ballOwner-1
];

addLog(
"⚪💥 "+
shooter.name+
" شوت می‌زند!"
);


setTimeout(
function(){

if(!playing)return;

if(
Math.random()<0.25
){

goal(
"away",
shooter.name
);

}
else{

addLog(
"🧤 دروازه‌بان "+
clubName+
" توپ را گرفت."
);

ballTeam="home";

ballOwner=1;

passTarget=null;

putBall();

}

},
350
);

}


/* =================================
   گل
================================= */

function goal(
team,
scorer
){

if(team==="home"){

homeScore++;

document.getElementById(
"homeScore"
).innerHTML=
homeScore;

addLog(
"🔴⚽ گوووول! "+
scorer+
" برای "+
clubName+
" گل زد! 🔥"
);

document.getElementById(
"result"
).innerHTML=
"<div class='goalText'>⚽ گل!</div>"+
clubName+
"<br>گلزن: "+
scorer+
"<br>نتیجه: "+
homeScore+
" - "+
awayScore;


ballTeam="away";

ballOwner=11;

}
else{

awayScore++;

document.getElementById(
"awayScore"
).innerHTML=
awayScore;

addLog(
"⚪⚽ گل "+
opponent+
"! گلزن: "+
scorer
);

document.getElementById(
"result"
).innerHTML=
"<div class='goalText'>⚽ گل حریف!</div>"+
opponent+
"<br>گلزن: "+
scorer+
"<br>نتیجه: "+
homeScore+
" - "+
awayScore;


ballTeam="home";

ballOwner=1;

}

passTarget=null;

putBall();

}


/* =================================
   تاکتیک
================================= */

function setTactic(type){

tactic=type;

if(type==="attack"){

addLog(
"🔥 تاکتیک هجومی فعال شد."
);

}
else{

addLog(
"🛡️ تاکتیک دفاعی فعال شد."
);

}

}


/* =================================
   گزارش
================================= */

function addLog(text){

let log=
document.getElementById(
"log"
);

log.innerHTML+=
"<br>"+text;

log.scrollTop=
log.scrollHeight;

}


/* =================================
   پایان
================================= */

function finishMatch(){

clearInterval(timer);

playing=false;

document.getElementById(
"startButton"
).disabled=false;


let text="";

if(
homeScore>awayScore
){

text="🏆 بردی!";

}
else if(
awayScore>homeScore
){

text="❌ باختی!";

}
else{

text="🤝 مساوی شد!";

}


document.getElementById(
"result"
).innerHTML=
text+
"<br>نتیجه نهایی: "+
homeScore+
" - "+
awayScore;


addLog(
"🏁 سوت پایان مسابقه!"
);

}


/* توپ اولیه */

putBall();

</script>
