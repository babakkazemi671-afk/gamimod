<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚽ مسابقه | گیمی‌مود</title>
<style>

*{box-sizing:border-box}

body{
    margin:0;
    font-family:tahoma;
    background:#101010;
    color:white;
    text-align:center;
}

header{
    background:#00bcd4;
    padding:18px;
    font-size:26px;
    font-weight:bold;
}

.game{
    width:96%;
    max-width:950px;
    margin:20px auto;
    padding:18px;
    background:#202020;
    border-radius:20px;
}

.score{
    display:flex;
    justify-content:space-around;
    align-items:center;
    font-size:19px;
    margin-bottom:15px;
}

.minute{
    color:#00e5ff;
    font-size:24px;
    font-weight:bold;
}

.field{
    position:relative;
    width:100%;
    height:500px;
    overflow:hidden;
    border:5px solid white;
    border-radius:12px;
    background:
    repeating-linear-gradient(
        90deg,
        #147636 0,
        #147636 70px,
        #18813b 70px,
        #18813b 140px
    );
}

.line{
    position:absolute;
    left:50%;
    top:0;
    width:3px;
    height:100%;
    background:white;
}

.circle{
    position:absolute;
    left:50%;
    top:50%;
    width:120px;
    height:120px;
    transform:translate(-50%,-50%);
    border:3px solid white;
    border-radius:50%;
}

.player{
    position:absolute;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:bold;
    transition:
    left .4s linear,
    top .4s linear;
}

.home{
    background:#d71920;
    border:2px solid white;
}

.away{
    background:#eee;
    color:#111;
    border:2px solid #111;
}

.ball{
    position:absolute;
    width:17px;
    height:17px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 7px #000;
    transition:
    left .3s linear,
    top .3s linear;
    z-index:10;
}

button{
    width:90%;
    max-width:500px;
    margin:12px auto;
    padding:15px;
    border:0;
    border-radius:13px;
    background:#00bcd4;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#555;
}

.log{
    margin-top:15px;
    padding:15px;
    height:180px;
    overflow:auto;
    background:#151515;
    border-radius:12px;
    text-align:right;
    line-height:2;
}

.result{
    margin-top:15px;
    padding:15px;
    background:#181818;
    border-radius:12px;
    line-height:2;
}

.back{
    display:block;
    width:230px;
    margin:25px auto;
    padding:14px;
    background:#333;
    color:white;
    text-decoration:none;
    border-radius:12px;
}

</style>
</head>
<body>
<header>
⚽ مسابقه فوتبال گیمی‌مود
</header>
<section class="game">
<div class="score">
<div>
🏟️ <span id="myClub">تیم من</span>
<br>
<b id="myScore">0</b>
</div>
<div class="minute">
دقیقه <span id="minute">0</span>
</div>
<div>
<span id="enemyClub">حریف</span> 🤖
<br>
<b id="enemyScore">0</b>
</div>
</div>
<div class="field">
<div class="line"></div>
<div class="circle"></div>
<div class="player home" id="h1">1</div>
<div class="player home" id="h2">2</div>
<div class="player home" id="h3">3</div>
<div class="player home" id="h4">4</div>
<div class="player home" id="h5">5</div>
<div class="player home" id="h6">6</div>
<div class="player home" id="h7">7</div>
<div class="player home" id="h8">8</div>
<div class="player home" id="h9">9</div>
<div class="player home" id="h10">10</div>
<div class="player home" id="h11">11</div>
<div class="player away" id="a1">1</div>
<div class="player away" id="a2">2</div>
<div class="player away" id="a3">3</div>
<div class="player away" id="a4">4</div>
<div class="player away" id="a5">5</div>
<div class="player away" id="a6">6</div>
<div class="player away" id="a7">7</div>
<div class="player away" id="a8">8</div>
<div class="player away" id="a9">9</div>
<div class="player away" id="a10">10</div>
<div class="player away" id="a11">11</div>
<div class="ball" id="ball"></div>
</div>
<button id="start" onclick="startMatch()">
▶️ شروع مسابقه
</button>
<div class="log" id="log">
🏟️ حریف به‌صورت خودکار انتخاب می‌شود.
</div>
<div class="result" id="result">
🤖 بازیکنان خودشان بازی می‌کنند.
</div>
</section>
<a class="back" href="myteam.html">
⬅️ برگشت به تیم من
</a>
<script>

const myClub =
localStorage.getItem("clubName")
|| "تیم من";

const myPower =
Number(
localStorage.getItem("clubPower")
) || 64;


/* =========================
   حریف‌های دسته ۲
========================= */

const opponents=[

{name:"شاهین شمال",power:58},
{name:"پارس جوان",power:61},
{name:"آریا شهر",power:63},
{name:"کویر FC",power:56},
{name:"ستاره جنوب",power:60},
{name:"سپیدار",power:65},
{name:"پاس تهران",power:62},
{name:"دریای خزر",power:59}

];


let opponent;

let minute=0;
let myScore=0;
let enemyScore=0;

let playing=false;
let timer;


/* =========================
   شروع
========================= */

function startMatch(){

    if(playing)return;

    opponent=
    opponents[
        Math.floor(
            Math.random()*
            opponents.length
        )
    ];


    minute=0;
    myScore=0;
    enemyScore=0;

    playing=true;


    document.getElementById(
        "myClub"
    ).innerHTML=myClub;

    document.getElementById(
        "enemyClub"
    ).innerHTML=
    opponent.name;


    document.getElementById(
        "myScore"
    ).innerHTML=0;

    document.getElementById(
        "enemyScore"
    ).innerHTML=0;

    document.getElementById(
        "minute"
    ).innerHTML=0;


    document.getElementById(
        "start"
    ).disabled=true;


    document.getElementById(
        "log"
    ).innerHTML=
    "🎲 حریف انتخاب شد: "+
    opponent.name+
    "<br>💪 قدرت حریف: "+
    opponent.power+
    "<br>⚽ سوت شروع!";


    document.getElementById(
        "result"
    ).innerHTML=
    "🤖 هوش مصنوعی مسابقه را کنترل می‌کند.";


    placePlayers();


    timer=
    setInterval(
        tick,
        700
    );

}


/* =========================
   حرکت بازیکنان
========================= */

function placePlayers(){

    for(let i=1;i<=11;i++){

        const h=
        document.getElementById(
            "h"+i
        );

        const a=
        document.getElementById(
            "a"+i
        );


        h.style.left=
        (8+
        Math.random()*40)
        +"%";

        h.style.top=
        (8+
        Math.random()*82)
        +"%";


        a.style.left=
        (52+
        Math.random()*40)
        +"%";

        a.style.top=
        (8+
        Math.random()*82)
        +"%";

    }


    moveBall(
        50,
        50
    );

}


function movePlayers(){

    for(let i=1;i<=11;i++){

        const h=
        document.getElementById(
            "h"+i
        );

        const a=
        document.getElementById(
            "a"+i
        );


        let hx=
        parseFloat(h.style.left);

        let hy=
        parseFloat(h.style.top);

        let ax=
        parseFloat(a.style.left);

        let ay=
        parseFloat(a.style.top);


        hx +=
        (ballX-hx)*0.08;

        hy +=
        (ballY-hy)*0.08;


        ax +=
        (ballX-ax)*0.07;

        ay +=
        (ballY-ay)*0.07;


        hx=Math.max(
            3,
            Math.min(47,hx)
        );

        ax=Math.max(
            53,
            Math.min(96,ax)
        );

        hy=Math.max(
            5,
            Math.min(92,hy)
        );

        ay=Math.max(
            5,
            Math.min(92,ay)
        );


        h.style.left=hx+"%";
        h.style.top=hy+"%";

        a.style.left=ax+"%";
        a.style.top=ay+"%";

    }

}


/* =========================
   توپ
========================= */

let ballX=50;
let ballY=50;

let ballTeam="home";


function moveBall(x,y){

    ballX=x;
    ballY=y;

    document.getElementById(
        "ball"
    ).style.left=
    x+"%";

    document.getElementById(
        "ball"
    ).style.top=
    y+"%";

}


function ballAction(){

    let targetX;
    let targetY;


    if(ballTeam==="home"){

        targetX=
        30+
        Math.random()*30;

        targetY=
        10+
        Math.random()*80;

    }

    else{

        targetX=
        40+
        Math.random()*35;

        targetY=
        10+
        Math.random()*80;

    }


    moveBall(
        targetX,
        targetY
    );


    if(Math.random()<0.08){

        ballTeam=
        ballTeam==="home"
        ?"away"
        :"home";

    }


    if(Math.random()<0.035){

        shoot();

    }

}


/* =========================
   شوت
========================= */

function shoot(){

    if(ballTeam==="home"){

        addLog(
        "🔴💥 شوت "+
        myClub+"!"
        );


        let chance =
        myPower /
        (
            myPower+
            opponent.power
        );


        if(
            Math.random()
            <
            chance*0.35
        ){

            myScore++;

            document.getElementById(
                "myScore"
            ).innerHTML=
            myScore;


            addLog(
            "⚽🔥 گل برای "+
            myClub+"!"
            );


            moveBall(
                94,
                50
            );

        }

        else{

            addLog(
            "🧤 دروازه‌بان حریف گرفت!"
            );

        }

    }

    else{

        addLog(
        "⚪💥 شوت "+
        opponent.name+"!"
        );


        let chance =
        opponent.power /
        (
            myPower+
            opponent.power
        );


        if(
            Math.random()
            <
            chance*0.30
        ){

            enemyScore++;

            document.getElementById(
                "enemyScore"
            ).innerHTML=
            enemyScore;


            addLog(
            "⚽ گل "+
            opponent.name+"!"
            );

            moveBall(
                5,
                50
            );

        }

        else{

            addLog(
            "🧤 دروازه‌بان "+
            myClub+
            " نجات داد!"
            );

        }

    }

}


/* =========================
   دقیقه بازی
========================= */

function tick(){

    if(!playing)return;

    minute++;

    document.getElementById(
        "minute"
    ).innerHTML=
    minute;


    movePlayers();

    ballAction();


    if(minute>=90){

        finishMatch();

    }

}


/* =========================
   پایان
========================= */

function finishMatch(){

    clearInterval(timer);

    playing=false;


    document.getElementById(
        "start"
    ).disabled=false;


    let text;


    if(myScore>enemyScore){

        text=
        "🏆 بردی!";

    }

    else if(myScore<enemyScore){

        text=
        "❌ باختی!";

    }

    else{

        text=
        "🤝 مساوی شد!";

    }


    document.getElementById(
        "result"
    ).innerHTML=
    text+
    "<br><br>"+
    myClub+
    " "+
    myScore+
    " - "+
    enemyScore+
    " "+
    opponent.name;


    addLog(
    "🏁 سوت پایان مسابقه!"
    );

}


/* =========================
   گزارش
========================= */

function addLog(text){

    const log=
    document.getElementById(
        "log"
    );

    log.innerHTML+=
    "<br>"+text;

    log.scrollTop=
    log.scrollHeight;

}

</script>
</body>

</html>
