<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ بازی فوتبال | گیمی مود</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
background:#101010;
color:white;
font-family:tahoma;
text-align:center;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:15px;
font-size:23px;
font-weight:bold;
}

.game{
width:96%;
max-width:1050px;
margin:12px auto;
background:#1d1d1d;
padding:12px;
border-radius:18px;
}

.score{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:8px;
font-weight:bold;
font-size:17px;
margin-bottom:10px;
}

.home{
color:#ff4242;
}

.away{
color:#eee;
}

.minute{
color:#00e5ff;
font-size:19px;
}

.field{
position:relative;
height:560px;
overflow:hidden;
border:4px solid white;
border-radius:14px;

background:
repeating-linear-gradient(
90deg,
#147636 0,
#147636 70px,
#18813b 70px,
#18813b 140px
);
}

.centerLine{
position:absolute;
left:50%;
top:0;
height:100%;
width:3px;
background:white;
}

.centerCircle{
position:absolute;
left:50%;
top:50%;
width:120px;
height:120px;
border:3px solid white;
border-radius:50%;
transform:translate(-50%,-50%);
}

.penalty{
position:absolute;
top:29%;
height:42%;
width:105px;
border:3px solid white;
}

.penalty.left{
left:-3px;
border-left:0;
}

.penalty.right{
right:-3px;
border-right:0;
}

.goal{
position:absolute;
top:39%;
width:28px;
height:120px;
border:4px solid white;
z-index:2;
}

.goal.left{left:-5px}
.goal.right{right:-5px}

.defenceLine{
position:absolute;
top:0;
height:100%;
border-left:2px dashed rgba(255,255,255,.5);
z-index:1;
}

.homeDefenceLine{
left:42%;
}

.awayDefenceLine{
left:58%;
}

.player{
position:absolute;
width:43px;
height:43px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:bold;
text-align:center;
padding:3px;
z-index:5;

transition:
left .16s linear,
top .16s linear;
}

.red{
background:#d71920;
color:white;
border:2px solid white;
}

.white{
background:#eee;
color:#111;
border:2px solid #111;
}

.gk{
box-shadow:0 0 0 3px #ffd700;
}

.ball{
position:absolute;
width:17px;
height:17px;
background:white;
border:2px solid #111;
border-radius:50%;
z-index:10;

transition:
left .12s linear,
top .12s linear;
}

.controls{
margin-top:10px;
}

button{
border:0;
border-radius:11px;
padding:11px 17px;
margin:4px;
font-family:tahoma;
font-weight:bold;
color:white;
cursor:pointer;
}

.start{background:#00bcd4}
.attack{background:#e67e22}
.balanced{background:#2980b9}
.defend{background:#8e44ad}

button:disabled{
background:#555;
}

.log{
height:150px;
overflow:auto;
background:#141414;
margin-top:10px;
padding:10px;
border-radius:11px;
text-align:right;
line-height:1.8;
}

.result{
background:#141414;
padding:12px;
border-radius:11px;
margin-top:10px;
line-height:1.9;
}

.back{
display:block;
width:220px;
margin:20px auto;
padding:13px;
background:#333;
color:white;
text-decoration:none;
border-radius:11px;
}

.goalText{
font-size:23px;
color:#ffd700;
font-weight:bold;
}
</style>
</head>
<body>
<header>
⚽ بازی فوتبال گیمی مود
</header>
<div class="game">
<div class="score">
<div class="home">
<span id="homeName">تیم من</span>
<br>
<span id="homeScore">0</span>
</div>
<div class="minute">
دقیقه
<span id="minute">1</span>
</div>
<div class="away">
<span id="awayName">حریف</span>
<br>
<span id="awayScore">0</span>
</div>
</div>
<div class="field">
<div class="centerLine"></div>
<div class="centerCircle"></div>
<div class="penalty left"></div>
<div class="penalty right"></div>
<div class="goal left"></div>
<div class="goal right"></div>
<div class="defenceLine homeDefenceLine"></div>
<div class="defenceLine awayDefenceLine"></div>
<div id="homePlayers"></div>
<div id="awayPlayers"></div>
<div id="ball" class="ball"></div>
</div>
<div class="controls">
<button
class="start"
id="startButton"
onclick="startMatch()">
▶️ شروع بازی
</button>
<br>
<button
class="attack"
onclick="setTactic('attack')">
🔥 هجومی
</button>
<button
class="balanced"
onclick="setTactic('balanced')">
⚖️ متعادل
</button>
<button
class="defend"
onclick="setTactic('defend')">
🛡️ دفاعی
</button>
</div>
<div id="log" class="log">
🏟️ بازی آماده است.
</div>
<div id="result" class="result">
ترکیب تیم من از حافظه سایت خوانده می‌شود.
</div>
</div>
<a class="back" href="myteam.html">
⬅️ برگشت به تیم من
</a>
<script>

/* =====================================
   اطلاعات تیم
===================================== */

const savedLineup =
JSON.parse(
localStorage.getItem("lineup")
) || {};

const formation =
localStorage.getItem("formation")
|| "4-3-3";

const clubName =
localStorage.getItem("clubName")
|| "تیم من";

const opponent =
localStorage.getItem("leagueOpponent")
|| "حریف";

document.getElementById("homeName").innerHTML =
clubName;

document.getElementById("awayName").innerHTML =
opponent;


/* =====================================
   بازیکنان
===================================== */

const savedPlayers =
Object.values(savedLineup);

const homePlayers=[];


/*
 اگر کمتر از 11 بازیکن داشته باشی،
 جای خالی با بازیکن موقت پر می‌شود.
*/

for(let i=0;i<11;i++){

let p=savedPlayers[i];

if(!p){

p={
name:"بازیکن "+(i+1),
power:60,
position:
i===0
?"GK":
i<5
?"DEF":
i<8
?"MID":
"ATT"
};

}

homePlayers.push({
number:i+1,
name:p.name,
power:Number(p.power)||60,
position:p.position
});

}


/* =====================================
   بازیکنان حریف
===================================== */

const awayPlayers=[];

const enemyNames=[
"دروازه‌بان حریف",
"مدافع راست",
"مدافع چپ",
"مدافع وسط",
"مدافع مرکزی",
"هافبک راست",
"هافبک مرکزی",
"هافبک چپ",
"وینگر راست",
"مهاجم",
"مهاجم نوک"
];

for(let i=0;i<11;i++){

awayPlayers.push({

number:i+1,

name:enemyNames[i],

power:65+(i%20),

position:
i===0
?"GK":
i<5
?"DEF":
i<8
?"MID":
"ATT"

});

}


/* =====================================
   آرایش‌ها
===================================== */

const formations={

"4-3-3":[

[8,50],

[23,18],
[21,39],
[21,61],
[23,82],

[38,25],
[39,50],
[38,75],

[66,25],
[70,50],
[66,75]

],

"4-4-2":[

[8,50],

[23,18],
[21,39],
[21,61],
[23,82],

[39,18],
[39,40],
[39,60],
[39,82],

[68,40],
[68,60]

],

"3-4-3":[

[8,50],

[23,25],
[21,50],
[23,75],

[40,18],
[40,40],
[40,60],
[40,82],

[68,25],
[70,50],
[68,75]

],

"5-3-2":[

[8,50],

[22,12],
[20,31],
[20,50],
[20,69],
[22,88],

[40,25],
[40,50],
[40,75],

[68,40],
[68,60]

],

"3-5-2":[

[8,50],

[23,25],
[21,50],
[23,75],

[40,12],
[40,30],
[40,50],
[40,70],
[40,88],

[68,40],
[68,60]

]

};

const homeSpots =
formations[formation] ||
formations["4-3-3"];


/* =====================================
   وضعیت بازی
===================================== */

let playing=false;

let minute=1;

let homeScore=0;

let awayScore=0;

let timer=null;

let tactic="balanced";


/*
 مالک توپ
*/

let ballTeam="home";

let ballOwner=10;


/*
 پاس در حال حرکت
*/

let pass=null;


/*
 شوت در حال حرکت
*/

let shot=null;


/*
 زمان آخرین اتفاق
*/

let actionCooldown=0;


/* =====================================
   ساخت بازیکنان روی زمین
===================================== */

function createPlayers(){

const homeBox=
document.getElementById("homePlayers");

const awayBox=
document.getElementById("awayPlayers");

homeBox.innerHTML="";
awayBox.innerHTML="";


/* تیم خودمان */

homePlayers.forEach(
(player,index)=>{

const div=
document.createElement("div");

div.className=
"player red";

if(player.position==="GK" || index===0){

div.classList.add("gk");

}

div.id=
"home_"+player.number;

div.innerHTML=
shortName(player.name)+
"<br>"+
player.power;

div.style.left=
homeSpots[index][0]+"%";

div.style.top=
homeSpots[index][1]+"%";

homeBox.appendChild(div);

});


/* حریف */

awayPlayers.forEach(
(player,index)=>{

const div=
document.createElement("div");

div.className=
"player white";

if(player.position==="GK" || index===0){

div.classList.add("gk");

}

div.id=
"away_"+player.number;

div.innerHTML=
shortName(player.name)+
"<br>"+
player.power;

div.style.left=
(100-homeSpots[index][0])+"%";

div.style.top=
homeSpots[index][1]+"%";

awayBox.appendChild(div);

});

}


/* =====================================
   نام کوتاه
===================================== */

function shortName(name){

if(name.length<=12)
return name;

return name.substring(0,11)+"…";

}


/* =====================================
   گرفتن موقعیت
===================================== */

function pos(team,index){

const el=
document.getElementById(
team+"_"+index
);

return{

x:parseFloat(el.style.left),
y:parseFloat(el.style.top)

};

}


/* =====================================
   تغییر موقعیت
===================================== */

function setPos(team,index,x,y){

const el=
document.getElementById(
team+"_"+index
);

el.style.left=
x+"%";

el.style.top=
y+"%";

}


/* =====================================
   فاصله
===================================== */

function dist(a,b){

return Math.sqrt(

Math.pow(a.x-b.x,2)+
Math.pow(a.y-b.y,2)

);

}


/* =====================================
   محل پایه بازیکن
===================================== */

function basePosition(team,index){

let x=homeSpots[index][0];

let y=homeSpots[index][1];

if(team==="away"){

x=100-x;

}

return{x,y};

}


/* =====================================
   محدود کردن بازیکن
===================================== */

function clampPlayer(
team,index,x,y
){

const player=
team==="home"
?
homePlayers[index-1]
:
awayPlayers[index-1];

const posName=
player.position;


/*
 دروازه‌بان
*/

if(posName==="GK"){

if(team==="home"){

x=Math.max(4,Math.min(14,x));

}
else{

x=Math.max(86,Math.min(96,x));

}

y=Math.max(35,Math.min(65,y));

return{x,y};

}


/*
 مدافع
*/

if(posName==="DEF"){

if(team==="home"){

x=Math.max(10,Math.min(45,x));

}
else{

x=Math.max(55,Math.min(90,x));

}

}


/*
 هافبک
*/

if(posName==="MID"){

if(team==="home"){

x=Math.max(20,Math.min(67,x));

}
else{

x=Math.max(33,Math.min(80,x));

}

}


/*
 مهاجم
*/

if(posName==="ATT"){

if(team==="home"){

x=Math.max(50,Math.min(92,x));

}
else{

x=Math.max(8,Math.min(50,x));

}

}


y=Math.max(7,Math.min(93,y));

return{x,y};

}


/* =====================================
   توپ
===================================== */

function updateBall(){

const ball=
document.getElementById("ball");


if(pass){

ball.style.left=
pass.x+"%";

ball.style.top=
pass.y+"%";

return;

}


if(shot){

ball.style.left=
shot.x+"%";

ball.style.top=
shot.y+"%";

return;

}


const p=
pos(ballTeam,ballOwner);

ball.style.left=
(p.x-0.8)+"%";

ball.style.top=
(p.y-1.5)+"%";

}


/* =====================================
   شروع بازی
===================================== */

function startMatch(){

if(playing)return;

playing=true;

minute=1;

homeScore=0;

awayScore=0;

ballTeam="home";

ballOwner=10;

pass=null;

shot=null;

actionCooldown=0;

document.getElementById("homeScore").innerHTML=0;
document.getElementById("awayScore").innerHTML=0;
document.getElementById("minute").innerHTML=1;

document.getElementById("startButton").disabled=true;

document.getElementById("log").innerHTML=
"🏟️ سوت شروع بازی!<br>"+
"🔴 "+clubName+
" توپ را در اختیار دارد.";

document.getElementById("result").innerHTML=
"⚽ مسابقه شروع شد.";

updateBall();


/*
 هر 0.8 ثانیه
 حدود یک دقیقه مسابقه
*/

timer=
setInterval(
gameTick,
800
);

}


/* =====================================
   تیک بازی
===================================== */

function gameTick(){

if(!playing)return;

minute++;

document.getElementById("minute").innerHTML=
minute;


if(actionCooldown>0)
actionCooldown--;


/*
 اگر پاس در جریان است
*/

if(pass){

updatePass();

moveOffBallPlayers();

return;

}


/*
 اگر شوت در جریان است
*/

if(shot){

updateShot();

moveOffBallPlayers();

return;

}


/*
 بازیکنان بدون توپ
*/

moveOffBallPlayers();


/*
 بازیکن صاحب توپ
*/

moveBallCarrier();


/*
 تصمیم پاس یا شوت
*/

makeDecision();


updateBall();


/*
 پایان
*/

if(minute>=90){

finishMatch();

}

}


/* =====================================
   حرکت بازیکنان بدون توپ
===================================== */

function moveOffBallPlayers(){

for(let i=1;i<=11;i++){

if(
ballTeam==="home" &&
i===ballOwner
)
continue;

if(
ballTeam==="away" &&
i===ballOwner
)
continue;


const player=
ballTeam==="home"
?
homePlayers[i-1]
:
awayPlayers[i-1];

let p=
pos(
ballTeam,
i
);

let base=
basePosition(
ballTeam,
i
);


/*
 مهاجم همیشه جلو می‌ماند.
*/

if(player.position==="ATT"){

/*
 کمی حرکت عرضی
*/

let targetY=
base.y+
Math.sin(
(minute+i)*0.7
)*4;

p.y +=
(targetY-p.y)*0.12;


/*
 در حمله کمی جلوتر
*/

if(ballTeam==="home"){

let targetX=
tactic==="attack"
?Math.min(90,base.x+5)
:base.x;

p.x +=
(targetX-p.x)*0.08;

}
else{

let targetX=
tactic==="attack"
?Math.max(10,base.x-5)
:base.x;

p.x +=
(targetX-p.x)*0.08;

}

}


/*
 هافبک‌ها در مرکز می‌مانند.
*/

else if(player.position==="MID"){

p.x +=
(base.x-p.x)*0.10;

p.y +=
(base.y-p.y)*0.10;

}


/*
 دفاع‌ها خط دفاعی خودشان را حفظ می‌کنند.
*/

else if(player.position==="DEF"){

p.x +=
(base.x-p.x)*0.14;

p.y +=
(base.y-p.y)*0.12;

}


/*
 دروازه‌بان
*/

else{

p.x +=
(base.x-p.x)*0.25;

p.y +=
(base.y-p.y)*0.15;

}


/*
 فقط یک بازیکن نزدیک توپ
 برای کمک می‌آید؛ نه همه.
*/

if(
player.position!=="ATT" &&
player.position!=="GK"
){

const ballPos=
getBallPosition();

const d=
dist(p,ballPos);

if(d<18 && nearestPlayer(
ballTeam,
ballPos,
i
)){

p.x +=
(ballPos.x-p.x)*0.18;

p.y +=
(ballPos.y-p.y)*0.18;

}

}


/*
 محدودیت
*/

const fixed=
clampPlayer(
ballTeam,
i,
p.x,
p.y
);

setPos(
ballTeam,
i,
fixed.x,
fixed.y
);

}

}


/* =====================================
   نزدیک‌ترین بازیکن
===================================== */

function nearestPlayer(
team,
ballPos,
index
){

let best=999;

let bestIndex=-1;

for(let i=1;i<=11;i++){

if(i===index)continue;

const player=
team==="home"
?
homePlayers[i-1]
:
awayPlayers[i-1];

if(player.position==="GK")
continue;

const p=
pos(team,i);

const d=
dist(p,ballPos);

if(d<best){

best=d;

bestIndex=i;

}

}

return index===bestIndex;

}


/* =====================================
   موقعیت توپ
===================================== */

function getBallPosition(){

if(pass){

return{
x:pass.x,
y:pass.y
};

}

if(shot){

return{
x:shot.x,
y:shot.y
};

}

return pos(
ballTeam,
ballOwner
);

}


/* =====================================
   حرکت بازیکن صاحب توپ
===================================== */

function moveBallCarrier(){

const player=
ballTeam==="home"
?
homePlayers[ballOwner-1]
:
awayPlayers[ballOwner-1];

let p=
pos(
ballTeam,
ballOwner
);


/*
 مهاجم با توپ مستقیم به سمت دروازه می‌رود.
*/

if(player.position==="ATT"){

if(ballTeam==="home")
p.x+=1.8;
else
p.x-=1.8;

}


/*
 هافبک با توپ جلو می‌رود.
*/

else if(player.position==="MID"){

if(ballTeam==="home")
p.x+=1.15;
else
p.x-=1.15;

}


/*
 مدافع با توپ زیاد جلو نمی‌رود.
*/

else if(player.position==="DEF"){

if(ballTeam==="home")
p.x+=0.55;
else
p.x-=0.55;

}


/*
 تاکتیک هجومی
*/

if(tactic==="attack"){

if(ballTeam==="home")
p.x+=0.55;
else
p.x-=0.55;

}


/*
 محدودیت
*/

const fixed=
clampPlayer(
ballTeam,
ballOwner,
p.x,
p.y
);

setPos(
ballTeam,
ballOwner,
fixed.x,
fixed.y
);

}


/* =====================================
   تصمیم‌گیری
===================================== */

function makeDecision(){

if(actionCooldown>0)return;

const player=
ballTeam==="home"
?
homePlayers[ballOwner-1]
:
awayPlayers[ballOwner-1];

const p=
pos(
ballTeam,
ballOwner
);


/*
 اگر نزدیک دروازه است
 اولویت شوت
*/

const shootingZone=
ballTeam==="home"
?
p.x>=72
:
p.x<=28;


if(
shootingZone &&
player.position==="ATT"
){

shootBall();

return;

}


/*
 هافبک و مهاجم پاس می‌دهند.
*/

if(
player.position==="MID" ||
player.position==="ATT"
){

if(Math.random()<0.48){

passBall();

return;

}

}


/*
 اگر حریف خیلی نزدیک باشد
 پاس اجباری
*/

if(
player.position==="DEF" &&
Math.random()<0.30
){

passBall();

return;

}


/*
 برخورد و توپ‌گیری
*/

trySteal();

}


/* =====================================
   پیدا کردن هم‌تیمی برای پاس
===================================== */

function findPassTarget(){

const current=
pos(
ballTeam,
ballOwner
);

let candidates=[];


for(let i=1;i<=11;i++){

if(i===ballOwner)continue;

const player=
ballTeam==="home"
?
homePlayers[i-1]
:
awayPlayers[i-1];

const p=
pos(
ballTeam,
i
);

const d=
dist(current,p);


/*
 مهاجم را در پاس رو به جلو
 ترجیح می‌دهیم.
*/

let score=100-d;

if(
player.position==="ATT"
){

if(ballTeam==="home" && p.x>current.x)
score+=35;

if(ballTeam==="away" && p.x<current.x)
score+=35;

}


/*
 مدافع فقط در صورت نیاز.
*/

if(
player.position==="DEF"
){

score-=10;

}


if(d<38){

candidates.push({
index:i,
score:score
});

}

}


if(!candidates.length)
return null;


candidates.sort(
(a,b)=>
b.score-a.score
);


return candidates[0].index;

}


/* =====================================
   پاس
===================================== */

function passBall(){

if(actionCooldown>0)return;

const target=
findPassTarget();

if(!target)return;


const from=
pos(
ballTeam,
ballOwner
);

const to=
pos(
ballTeam,
target
);

pass={

startX:from.x,
startY:from.y,

endX:to.x,
endY:to.y,

progress:0,

x:from.x,
y:from.y,

target:target

};

actionCooldown=2;

addLog(
ballTeam==="home"
?
"🔴 پاس دقیق به "+
shortName(
homePlayers[target-1].name
)
:
"⚪ پاس حریف"
);

}


/* =====================================
   حرکت پاس
===================================== */

function updatePass(){

pass.progress+=0.25;

pass.x=
pass.startX+
(pass.endX-pass.startX)*
pass.progress;

pass.y=
pass.startY+
(pass.endY-pass.startY)*
pass.progress;

updateBall();


if(pass.progress>=1){

ballOwner=
pass.target;

pass=null;

}

}


/* =====================================
   شوت
===================================== */

function shootBall(){

if(actionCooldown>0)return;

const shooter=
ballTeam==="home"
?
homePlayers[ballOwner-1]
:
awayPlayers[ballOwner-1];

const start=
pos(
ballTeam,
ballOwner
);


/*
 هدف مرکز دروازه
*/

const targetX=
ballTeam==="home"
?97
:3;

const targetY=
45+
Math.random()*10;

shot={

x:start.x,
y:start.y,

startX:start.x,
startY:start.y,

targetX:targetX,
targetY:targetY,

progress:0,

shooter:shooter.name,

team:ballTeam

};

actionCooldown=6;

addLog(
ballTeam==="home"
?
"🔴⚽ "+
shortName(shooter.name)+
" شوت می‌زند!"
:
"⚪⚽ حریف شوت زد!"
);

}


/* =====================================
   حرکت شوت
===================================== */

function updateShot(){

shot.progress+=0.22;

shot.x=
shot.startX+
(shot.targetX-shot.startX)*
shot.progress;

shot.y=
shot.startY+
(shot.targetY-shot.startY)*
shot.progress;

updateBall();


if(shot.progress>=1){

resolveShot();

}

}


/* =====================================
   نتیجه شوت
===================================== */

function resolveShot(){

const team=
shot.team;

const shooter=
shot.shooter;

const goalChance=
team==="home"
?
0.36
:
0.28;


if(Math.random()<goalChance){

scoreGoal(
team,
shooter
);

}
else{

addLog(
team==="home"
?
"🧤 دروازه‌بان حریف توپ را گرفت."
:
"🧤 دروازه‌بان "+
clubName+
" توپ را گرفت."
);


/*
 بعد از شوت توپ به تیم دیگر می‌رسد.
*/

if(team==="home"){

ballTeam="away";
ballOwner=1;

}
else{

ballTeam="home";
ballOwner=1;

}

}


shot=null;

updateBall();

}


/* =====================================
   توپ‌گیری
===================================== */

function trySteal(){

const current=
pos(
ballTeam,
ballOwner
);

const other=
ballTeam==="home"
?
"away"
:
"home";

let nearest=-1;

let best=999;

for(let i=1;i<=11;i++){

const player=
other==="home"
?
homePlayers[i-1]
:
awayPlayers[i-1];

if(player.position==="GK")
continue;

const p=
pos(other,i);

const d=
dist(p,current);

if(d<best){

best=d;

nearest=i;

}

}


if(
nearest!==-1 &&
best<7 &&
Math.random()<0.28
){

ballTeam=other;

ballOwner=nearest;

addLog(
other==="home"
?
"🔴 توپ‌گیری! توپ برای "+
shortName(
homePlayers[nearest-1].name
)
+" شد."
:
"⚪ حریف توپ را گرفت."
);

}

}


/* =====================================
   گل
===================================== */

function scoreGoal(
team,
scorer
){

if(team==="home"){

homeScore++;

document.getElementById(
"homeScore"
).innerHTML=
homeScore;

addLog(

" برای "+
clubName+
" گل زد! 🔥"
);

document.getElementById(
"result"
).innerHTML=
"<div class='goalText'>⚽ گل!</div>"+

"<br>"+

" "+
homeScore+
" - "+
awayScore+
" "+
opponent;

ballTeam="away";
ballOwner=1;

}
else{

document.getElementById(
"awayScore"
).innerHTML=
awayScore;

"⚪⚽ گل برای "+
opponent+
"!"
);

document.getElementById(
"result"
).innerHTML=
"<div class='goalText'>⚽ گل حریف!</div>"+
"گلزن: "+
scorer+
"<br>"+
clubName+
" "+
homeScore+
" - "+
awayScore+
" "+
opponent;

ballTeam="home";
ballOwner=1;

}

pass=null;
shot=null;

updateBall();

}

);

   گزارش
===================================== */

function addLog(text){

document.getElementById("log");

log.scrollTop=
log.scrollHeight;

}

   پایان
===================================== */

function finishMatch(){

clearInterval(timer);

playing=false;

document.getElementById(
"startButton"
).disabled=false;


let text;

if(homeScore>awayScore){

}


document.getElementById(
"result"
).innerHTML=
text+
"<br>نتیجه نهایی: "+
clubName+
" "+
homeScore+
" - "+
awayScore+
" "+
opponent;


addLog(
"🏁 سوت پایان مسابقه!"
);

}

   شروع اولیه
===================================== */

createPlayers();

updateBall();
