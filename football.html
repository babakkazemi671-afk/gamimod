<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ بازی فوتبال گیمی‌مود</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:white;
text-align:center;
}

header{
background:#00bcd4;
padding:18px;
font-size:26px;
font-weight:bold;
}

.game{
width:96%;
max-width:1000px;
margin:18px auto;
padding:16px;
background:#202020;
border-radius:20px;
}

.score{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
font-weight:bold;
font-size:18px;
margin-bottom:15px;
}

.home{color:#ff3333}
.away{color:white}

.minute{
color:#00e5ff;
font-size:23px;
}

.field{
position:relative;
width:100%;
height:560px;
overflow:hidden;
border:5px solid white;
border-radius:14px;
background:
repeating-linear-gradient(
90deg,
#147636 0,
#147636 70px,
#18813b 70px,
#18813b 140px
);
}

.centerLine{
position:absolute;
left:50%;
top:0;
height:100%;
width:3px;
background:white;
}

.centerCircle{
position:absolute;
left:50%;
top:50%;
width:120px;
height:120px;
border:3px solid white;
border-radius:50%;
transform:translate(-50%,-50%);
}

.penalty{
position:absolute;
top:30%;
height:40%;
width:105px;
border:3px solid white;
}

.penalty.left{
left:-3px;
border-left:0;
}

.penalty.right{
right:-3px;
border-right:0;
}

.goal{
position:absolute;
top:39%;
height:120px;
width:30px;
border:5px solid white;
z-index:2;
}

.goal.left{left:-5px}
.goal.right{right:-5px}

.defenceLine{
position:absolute;
top:0;
height:100%;
width:3px;
border-left:2px dashed rgba(255,255,255,.5);
z-index:1;
}

.redLine{left:43%}
.whiteLine{left:57%}

.player{
position:absolute;
width:34px;
height:34px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
font-weight:bold;
z-index:5;
transition:left .18s linear,top .18s linear;
}

.red{
background:#d71920;
border:2px solid white;
color:white;
}

.white{
background:#eee;
border:2px solid #111;
color:#111;
}

.gk{
box-shadow:0 0 0 3px #ffd700;
}

.ball{
position:absolute;
width:18px;
height:18px;
background:white;
border:2px solid #111;
border-radius:50%;
z-index:8;
transition:left .12s linear,top .12s linear;
}

.controls{
margin-top:15px;
}

button{
border:0;
border-radius:12px;
padding:12px 22px;
margin:5px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
}

.start{background:#00bcd4}
.attack{background:#16a085}
.defend{background:#8e44ad}

button:disabled{
background:#555;
}

.log{
margin-top:15px;
height:180px;
overflow:auto;
background:#151515;
padding:14px;
border-radius:12px;
text-align:right;
line-height:2;
}

.result{
margin-top:15px;
padding:15px;
background:#151515;
border-radius:12px;
line-height:2;
}

.back{
display:block;
width:220px;
margin:25px auto;
padding:14px;
background:#333;
color:white;
text-decoration:none;
border-radius:12px;
}

.goalText{
font-size:24px;
color:#ffd700;
}
</style>
</head>
<body>
<header>
⚽ بازی فوتبال گیمی‌مود
</header>
<section class="game">
<div class="score">
<div class="home">
<span id="homeName">تیم من</span>
<br>
<span id="homeScore">0</span>
</div>
<div class="minute">
دقیقه
<span id="minute">1</span>
</div>
<div class="away">
<span id="awayName">حریف</span>
<br>
<span id="awayScore">0</span>
</div>
</div>
<div class="field">
<div class="centerLine"></div>
<div class="centerCircle"></div>
<div class="penalty left"></div>
<div class="penalty right"></div>
<div class="goal left"></div>
<div class="goal right"></div>
<div class="defenceLine redLine"></div>
<div class="defenceLine whiteLine"></div>
<div class="player red gk" id="r1">1</div>
<div class="player red" id="r2">2</div>
<div class="player red" id="r3">3</div>
<div class="player red" id="r4">4</div>
<div class="player red" id="r5">5</div>
<div class="player red" id="r6">6</div>
<div class="player red" id="r7">7</div>
<div class="player red" id="r8">8</div>
<div class="player red" id="r9">9</div>
<div class="player red" id="r10">10</div>
<div class="player red" id="r11">11</div>
<div class="player white gk" id="w1">1</div>
<div class="player white" id="w2">2</div>
<div class="player white" id="w3">3</div>
<div class="player white" id="w4">4</div>
<div class="player white" id="w5">5</div>
<div class="player white" id="w6">6</div>
<div class="player white" id="w7">7</div>
<div class="player white" id="w8">8</div>
<div class="player white" id="w9">9</div>
<div class="player white" id="w10">10</div>
<div class="player white" id="w11">11</div>
<div class="ball" id="ball"></div>
</div>
<div class="controls">
<button
class="start"
id="startButton"
onclick="startMatch()">
▶️ شروع مسابقه
</button>
<br>
<button
class="attack"
onclick="setTactic('attack')">
🔥 هجومی
</button>
<button
class="defend"
onclick="setTactic('defend')">
🛡️ دفاعی
</button>
</div>
<div class="log" id="log">
🏟️ آماده شروع مسابقه...
</div>
<div class="result" id="result">
⚽ بازیکنان آماده مسابقه هستند.
</div>
</section>
<a class="back" href="myteam.html">
⬅️ برگشت به تیم من
</a>
<script>

let playing=false;
let minute=1;
let homeScore=0;
let awayScore=0;
let timer=null;
let tactic="balanced";

let ballOwner=7;
let ballTeam="home";
let passTarget=null;
let actionCooldown=0;


/* نام تیم‌ها */

let homeName=
localStorage.getItem("clubName")
||"تیم من";

let awayName=
localStorage.getItem("leagueOpponent")
||localStorage.getItem("hazfiOpponent")
||"حریف";

document.getElementById("homeName").innerHTML=homeName;
document.getElementById("awayName").innerHTML=awayName;


/* ترکیب */

let lineup=
JSON.parse(
localStorage.getItem("lineup")
) || {};


/* جای اولیه */

const homeBase=[

[7,50],

[18,22],
[18,40],
[18,60],
[18,78],

[30,30],
[32,50],
[30,70],

[48,28],
[48,50],
[48,72]

];

const awayBase=[

[93,50],

[82,22],
[82,40],
[82,60],
[82,78],

[70,30],
[68,50],
[70,70],

[52,28],
[52,50],
[52,72]

];


/* محدوده حرکت */

const homeZones={

1:{minX:4,maxX:13},

2:{minX:8,maxX:43},
3:{minX:8,maxX:43},
4:{minX:8,maxX:43},
5:{minX:8,maxX:43},

6:{minX:12,maxX:58},
7:{minX:12,maxX:62},
8:{minX:12,maxX:58},

9:{minX:25,maxX:82},
10:{minX:25,maxX:82},
11:{minX:25,maxX:82}

};

const awayZones={

1:{minX:87,maxX:96},

2:{minX:57,maxX:92},
3:{minX:57,maxX:92},
4:{minX:57,maxX:92},
5:{minX:57,maxX:92},

6:{minX:38,maxX:88},
7:{minX:38,maxX:88},
8:{minX:38,maxX:88},

9:{minX:18,maxX:75},
10:{minX:18,maxX:75},
11:{minX:18,maxX:75}

};


/* قرار دادن بازیکنان */

function placePlayers(){

for(let i=1;i<=11;i++){

let r=
document.getElementById("r"+i);

let w=
document.getElementById("w"+i);

r.style.left=
homeBase[i-1][0]+"%";

r.style.top=
homeBase[i-1][1]+"%";

w.style.left=
awayBase[i-1][0]+"%";

w.style.top=
awayBase[i-1][1]+"%";

}


/* نام بازیکنان */

let players=
Object.values(lineup);

for(
let i=0;
i<players.length &&
i<11;
i++
){

if(players[i].name){

document.getElementById(
"r"+(i+1)
).innerHTML=
players[i].name.substring(0,7);

}

}

}

placePlayers();


/* موقعیت */

function getPosition(team,number){

let element=
document.getElementById(
team==="home"
? "r"+number
: "w"+number
);

return{

x:parseFloat(element.style.left),
y:parseFloat(element.style.top)

};

}


/* فاصله */

function distance(x1,y1,x2,y2){

return Math.sqrt(
Math.pow(x2-x1,2)+
Math.pow(y2-y1,2)
);

}


/* توپ روی بازیکن */

function putBallOnOwner(){

let pos=
getPosition(
ballTeam,
ballOwner
);

let ball=
document.getElementById("ball");

ball.style.left=
(pos.x-0.8)+"%";

ball.style.top=
(pos.y-1.2)+"%";

}


/* شروع */

function startMatch(){

if(playing)return;

playing=true;

minute=1;

homeScore=0;

awayScore=0;

ballTeam="home";

ballOwner=7;

passTarget=null;

actionCooldown=0;

document.getElementById("homeScore").innerHTML=0;
document.getElementById("awayScore").innerHTML=0;
document.getElementById("minute").innerHTML=1;

document.getElementById("log").innerHTML=
"🏟️ سوت شروع مسابقه!"+
"<br>⚽ "+homeName+
" صاحب توپ است.";

document.getElementById("result").innerHTML=
"⚽ بازی شروع شد.";

document.getElementById("startButton").disabled=true;

putBallOnOwner();

timer=
setInterval(gameTick,600);

}


/* تیک بازی */

function gameTick(){

if(!playing)return;

minute++;

document.getElementById("minute").innerHTML=minute;

if(actionCooldown>0)
actionCooldown--;

movePlayersSmart();

if(passTarget!==null){
moveBallToTarget();
}
else{
putBallOnOwner();
}

footballDecision();

if(minute>=90){
finishMatch();
}

}


/* حرکت بازیکنان */

function movePlayersSmart(){

for(let i=1;i<=11;i++){

moveOnePlayer("home",i);
moveOnePlayer("away",i);

}

}


/* حرکت بازیکن */

function moveOnePlayer(team,number){

let element=
document.getElementById(
team==="home"
? "r"+number
: "w"+number
);

let pos=
getPosition(team,number);

let zone=
team==="home"
? homeZones[number]
: awayZones[number];


/*
 صاحب توپ سریع‌تر حرکت می‌کند
*/

if(
team===ballTeam &&
number===ballOwner &&
passTarget===null
){

let direction=
team==="home"
? 1
: -1;

/* سرعت بیشتر */

pos.x+=
direction*1.8;


/* تاکتیک هجومی */

if(
team==="home" &&
tactic==="attack"
){

pos.x+=0.6;

}


/* تاکتیک دفاعی */

if(
team==="home" &&
tactic==="defend"
){

pos.x-=0.5;

}

}


/*
 فقط بازیکن نزدیک توپ
 می‌تواند کمی دنبال آن برود
*/

if(
team===ballTeam &&
number!==ballOwner &&
Math.random()<0.20
){

let ballPos=
getPosition(
ballTeam,
ballOwner
);

let d=
distance(
pos.x,
pos.y,
ballPos.x,
ballPos.y
);

if(d<22){

pos.x+=
(ballPos.x-pos.x)*0.18;

pos.y+=
(ballPos.y-pos.y)*0.18;

}

}


/* حرکت طبیعی */

if(
Math.random()<0.20 &&
number!==ballOwner
){

pos.y+=
(Math.random()-0.5)*2;

}


/* محدودیت منطقه */

pos.x=
Math.max(
zone.minX,
Math.min(
zone.maxX,
pos.x
)
);

pos.y=
Math.max(
7,
Math.min(
93,
pos.y
)
);

element.style.left=
pos.x+"%";

element.style.top=
pos.y+"%";

}


/* پاس */

function passBall(){

if(actionCooldown>0)return;

let team=ballTeam;

let candidates=[];

let owner=
getPosition(
team,
ballOwner
);

for(let i=1;i<=11;i++){

if(i===ballOwner)continue;

let p=
getPosition(team,i);

let d=
distance(
p.x,p.y,
owner.x,owner.y
);

if(d<45){

candidates.push({
number:i,
distance:d
});

}

}

if(!candidates.length)return;

let target=
candidates[
Math.floor(
Math.random()*candidates.length
)
];

passTarget=target.number;

actionCooldown=2;

addLog(
team==="home"
?
"🔴 پاس "+homeName
:
"⚪ پاس "+awayName
);

}


/* حرکت پاس */

function moveBallToTarget(){

let from=
getPosition(
ballTeam,
ballOwner
);

let to=
getPosition(
ballTeam,
passTarget
);

let newX=
from.x+
(to.x-from.x)*0.55;

let newY=
from.y+
(to.y-from.y)*0.55;

let ball=
document.getElementById("ball");

ball.style.left=
(newX-0.8)+"%";

ball.style.top=
(newY-1.2)+"%";

if(
distance(
newX,newY,
to.x,to.y
)<4
){

ballOwner=
passTarget;

passTarget=null;

}

}


/* تصمیم */

function footballDecision(){

if(passTarget!==null)return;

let pos=
getPosition(
ballTeam,
ballOwner
);


/* پاس */

if(Math.random()<0.30){

passBall();

return;

}


/* شوت */

if(ballTeam==="home"){

if(
pos.x>62 &&
actionCooldown===0
){

shootHome();

return;

}

}
else{

if(
pos.x<38 &&
actionCooldown===0
){

shootAway();

return;

}

}


/* توپ‌گیری */

if(Math.random()<0.08){

changePossession();

}

}


/* توپ‌گیری */

function changePossession(){

let oldTeam=ballTeam;

let newTeam=
oldTeam==="home"
? "away"
: "home";

let nearest=1;
let best=999;

for(let i=1;i<=11;i++){

let p=
getPosition(
newTeam,
i
);

let owner=
getPosition(
oldTeam,
ballOwner
);

let d=
distance(
p.x,p.y,
owner.x,owner.y
);

if(d<best){

best=d;
nearest=i;

}

}

if(best<18){

ballTeam=newTeam;
ballOwner=nearest;
passTarget=null;

addLog(
newTeam==="home"
?
"🔴 "+homeName+
" توپ را پس گرفت!"
:
"⚪ "+awayName+
" توپ را گرفت!"
);

}

}


/* شوت تیم ما */

function shootHome(){

if(actionCooldown>0)return;

actionCooldown=5;

let shooter=
getHomeShooter();

addLog(
"🔴💥 "+
shooter+
" شوت می‌زند!"
);

setTimeout(
function(){

if(Math.random()<0.30){

goal("home",shooter);

}
else{

addLog(
"🧤 دروازه‌بان "+
awayName+
" شوت را گرفت!"
);

ballTeam="away";
ballOwner=1;
passTarget=null;

putBallOnOwner();

}

},
450
);

}


/* شوت حریف */

function shootAway(){

if(actionCooldown>0)return;

actionCooldown=5;

let shooter=
getAwayShooter();

addLog(
"⚪💥 "+
shooter+
" شوت می‌زند!"
);

setTimeout(
function(){

if(Math.random()<0.27){

goal("away",shooter);

}
else{

addLog(
"🧤 دروازه‌بان "+
homeName+
" توپ را گرفت!"
);

ballTeam="home";
ballOwner=1;
passTarget=null;

putBallOnOwner();

}

},
450
);

}


/* گل */

function goal(team,shooter){

if(team==="home"){

homeScore++;

document.getElementById("homeScore").innerHTML=
homeScore;

addLog(
"🔴⚽ گوووول! "+
shooter+
" برای "+
homeName+
" گل زد! 🔥"
);

document.getElementById("result").innerHTML=
"<div class='goalText'>⚽ گل!</div>"+
homeName+
"<br>گلزن: "+
shooter+
"<br>نتیجه: "+
homeScore+
" - "+
awayScore;

ballTeam="away";
ballOwner=1;

}
else{

awayScore++;

document.getElementById("awayScore").innerHTML=
awayScore;

addLog(
"⚪⚽ گل "+
awayName+
"! گلزن: "+
shooter
);

document.getElementById("result").innerHTML=
"<div class='goalText'>⚽ گل حریف!</div>"+
awayName+
"<br>گلزن: "+
shooter+
"<br>نتیجه: "+
homeScore+
" - "+
awayScore;

ballTeam="home";
ballOwner=7;

}

passTarget=null;

putBallOnOwner();

}


/* گلزن */

function getHomeShooter(){

let players=
Object.values(lineup);

let attackers=
players.filter(
p=>p.position==="ATT"
);

if(attackers.length){

return attackers[
Math.floor(
Math.random()*attackers.length
)
].name;

}

return "مهاجم "+ballOwner;

}


/* گلزن حریف */

function getAwayShooter(){

const names=[
"مهاجم شماره 9",
"مهاجم شماره 10",
"کاپیتان",
"وینگر راست",
"وینگر چپ"
];

return names[
Math.floor(
Math.random()*names.length
)
];

}


/* تاکتیک */

function setTactic(type){

tactic=type;

localStorage.setItem(
"tactic",
type
);

if(type==="attack"){

addLog(
"🔥 تاکتیک هجومی فعال شد."
);

}
else{

addLog(
"🛡️ تاکتیک دفاعی فعال شد."
);

}

}


/* گزارش */

function addLog(text){

let log=
document.getElementById("log");

log.innerHTML+=
"<br>"+text;

log.scrollTop=
log.scrollHeight;

}


/* پایان */

function finishMatch(){

clearInterval(timer);

playing=false;

document.getElementById(
"startButton"
).disabled=false;

let result;

if(homeScore>awayScore){

result="🏆 بردی!";

}
else if(awayScore>homeScore){

result="❌ باختی!";

}
else{

result="🤝 مساوی شد!";

}

document.getElementById(
"result"
).innerHTML=
result+
"<br>نتیجه نهایی: "+
homeScore+
" - "+
awayScore;

addLog(
"🏁 سوت پایان مسابقه!"
);

}


/* توپ اولیه */

putBallOnOwner();

</script>
</body>

   </html>
