<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚽ فوتبال گیمی‌مود</title>
<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:tahoma;
    background:#101010;
    color:white;
    text-align:center;
}

header{
    background:#00bcd4;
    padding:20px;
    font-size:27px;
    font-weight:bold;
}

.panel{
    width:94%;
    max-width:900px;
    margin:20px auto;
    padding:20px;
    background:#202020;
    border-radius:20px;
    box-shadow:0 0 15px #000;
}

h2{
    color:#00e5ff;
}

.teamGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
    margin-top:15px;
}

.team{
    padding:15px 8px;
    background:#303030;
    border:2px solid transparent;
    border-radius:15px;
    cursor:pointer;
    font-weight:bold;
}

.team:hover{
    background:#383838;
}

.team.selected{
    border-color:#00e5ff;
    background:#164c55;
}

.start{
    margin-top:20px;
    padding:15px 30px;
    border:0;
    border-radius:12px;
    background:#00bcd4;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.hidden{
    display:none;
}

.score{
    display:flex;
    justify-content:space-around;
    align-items:center;
    font-size:20px;
    margin-bottom:15px;
}

.minute{
    color:#00e5ff;
    font-size:24px;
    font-weight:bold;
}

.field{
    position:relative;
    width:100%;
    height:480px;
    overflow:hidden;
    border:4px solid white;
    border-radius:12px;

    background:
    repeating-linear-gradient(
        90deg,
        #147636 0,
        #147636 70px,
        #18813b 70px,
        #18813b 140px
    );
}

.centerLine{
    position:absolute;
    left:50%;
    top:0;
    width:3px;
    height:100%;
    background:white;
}

.circle{
    position:absolute;
    left:50%;
    top:50%;
    width:110px;
    height:110px;
    transform:translate(-50%,-50%);
    border:3px solid white;
    border-radius:50%;
}

.goal{
    position:absolute;
    top:38%;
    width:25px;
    height:120px;
    border:4px solid white;
}

.leftGoal{left:-4px}
.rightGoal{right:-4px}

.player{
    position:absolute;
    width:31px;
    height:31px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:bold;
    z-index:3;
    transition:
    left .35s linear,
    top .35s linear;
}

.home{
    background:#d71920;
    color:white;
    border:2px solid white;
}

.away{
    background:#eeeeee;
    color:#111;
    border:2px solid #111;
}

.gk{
    box-shadow:0 0 0 3px #ffd700;
}

.ball{
    position:absolute;
    width:17px;
    height:17px;
    border-radius:50%;
    background:white;
    z-index:5;
    box-shadow:0 0 8px #000;
    transition:left .25s linear,top .25s linear;
}

.controls{
    margin-top:15px;
}

.control{
    border:0;
    border-radius:10px;
    padding:12px 20px;
    margin:5px;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.attack{
    background:#16a085;
}

.defend{
    background:#8e44ad;
}

.log{
    margin-top:15px;
    padding:15px;
    height:150px;
    overflow:auto;
    background:#151515;
    border-radius:12px;
    text-align:right;
    line-height:2;
}

.result{
    margin-top:15px;
    padding:15px;
    background:#181818;
    border-radius:12px;
    line-height:2;
}

.back{
    display:block;
    width:230px;
    margin:25px auto;
    padding:14px;
    background:#333;
    color:white;
    text-decoration:none;
    border-radius:12px;
}
</style>
</head>
<body>
<header>
⚽ فوتبال گیمی‌مود
</header>
<!-- انتخاب تیم -->
<section class="panel" id="teamPanel">
<h2>🏟️ تیم خودت را انتخاب کن</h2>
<div class="teamGrid" id="homeTeams"></div>
<h2>🆚 تیم حریف را انتخاب کن</h2>
<div class="teamGrid" id="awayTeams"></div>
<button class="start" onclick="startMatch()">
▶️ شروع مسابقه
</button>
</section>
<!-- بازی -->
<section class="panel hidden" id="gamePanel">
<div class="score">
<div>
<span id="homeName">تیم شما</span>
<br>
⚽ <span id="homeScore">0</span>
</div>
<div class="minute">
دقیقه<br>
<span id="minute">1</span>
</div>
<div>
<span id="awayName">حریف</span>
<br>
⚽ <span id="awayScore">0</span>
</div>
</div>
<div class="field">
<div class="centerLine"></div>
<div class="circle"></div>
<div class="goal leftGoal"></div>
<div class="goal rightGoal"></div>
<!-- بازیکنان -->
<div class="player home gk" id="h1">1</div>
<div class="player home" id="h2">2</div>
<div class="player home" id="h3">3</div>
<div class="player home" id="h4">4</div>
<div class="player home" id="h5">5</div>
<div class="player home" id="h6">6</div>
<div class="player home" id="h7">7</div>
<div class="player home" id="h8">8</div>
<div class="player home" id="h9">9</div>
<div class="player home" id="h10">10</div>
<div class="player home" id="h11">11</div>
<div class="player away gk" id="a1">1</div>
<div class="player away" id="a2">2</div>
<div class="player away" id="a3">3</div>
<div class="player away" id="a4">4</div>
<div class="player away" id="a5">5</div>
<div class="player away" id="a6">6</div>
<div class="player away" id="a7">7</div>
<div class="player away" id="a8">8</div>
<div class="player away" id="a9">9</div>
<div class="player away" id="a10">10</div>
<div class="player away" id="a11">11</div>
<div class="ball" id="ball"></div>
</div>
<div class="controls">
<button class="control attack"
onclick="setTactic('attack')">
🔥 حمله
</button>
<button class="control defend"
onclick="setTactic('defend')">
🛡️ دفاع
</button>
</div>
<div class="log" id="log">
🏟️ آماده مسابقه...
</div>
<div class="result" id="result">
🤖 بازیکنان توسط هوش مصنوعی بازی می‌کنند.
</div>
</section>
<a class="back" href="coin.html">
⬅️ برگشت به مرکز سرگرمی
</a>
<script>

const teams = [

"🔴 پرسپولیس",
"🔵 استقلال",
"🟡 سپاهان",
"🔴 تراکتور",
"🟠 فولاد",
"🟢 ذوب‌آهن",
"🔵 گل‌گهر",
"🟠 مس رفسنجان",
"🟣 آلومینیوم",
"🟢 ملوان",
"🔴 نساجی",
"🔵 پیکان",
"🟠 شمس‌آذر",
"🟢 هوادار",
"🔴 خیبر خرم‌آباد",
"🟡 چادرملو"

];


let homeTeam=null;
let awayTeam=null;

let playing=false;

let minute=1;

let homeScore=0;
let awayScore=0;

let timer=null;

let tactic="normal";

let ballX=50;
let ballY=50;

let ballOwner="home";


const homeBase=[
[7,50],
[18,20],
[18,40],
[18,60],
[18,80],
[32,25],
[32,50],
[32,75],
[47,25],
[47,50],
[47,75]
];

const awayBase=[
[93,50],
[82,20],
[82,40],
[82,60],
[82,80],
[68,25],
[68,50],
[68,75],
[53,25],
[53,50],
[53,75]
];


function createTeams(){

    const home =
    document.getElementById("homeTeams");

    const away =
    document.getElementById("awayTeams");

    teams.forEach(function(team,index){

        const h =
        document.createElement("div");

        h.className="team";
        h.innerHTML=team;

        h.onclick=function(){

            homeTeam=team;

            document
            .querySelectorAll("#homeTeams .team")
            .forEach(x=>x.classList.remove("selected"));

            h.classList.add("selected");

        };

        home.appendChild(h);


        const a =
        document.createElement("div");

        a.className="team";
        a.innerHTML=team;

        a.onclick=function(){

            if(team===homeTeam){

                alert("❌ نمی‌توانی یک تیم را با خودش بازی بدهی.");

                return;
            }

            awayTeam=team;

            document
            .querySelectorAll("#awayTeams .team")
            .forEach(x=>x.classList.remove("selected"));

            a.classList.add("selected");

        };

        away.appendChild(a);

    });
}


createTeams();


function startMatch(){

    if(!homeTeam || !awayTeam){

        alert("⚠️ اول تیم خودت و حریف را انتخاب کن.");

        return;
    }


    document.getElementById("teamPanel")
    .classList.add("hidden");

    document.getElementById("gamePanel")
    .classList.remove("hidden");


    document.getElementById("homeName")
    .innerHTML=homeTeam;

    document.getElementById("awayName")
    .innerHTML=awayTeam;


    homeScore=0;
    awayScore=0;
    minute=1;
    ballOwner="home";
    ballX=50;
    ballY=50;
    tactic="normal";


    document.getElementById("homeScore")
    .innerHTML=0;

    document.getElementById("awayScore")
    .innerHTML=0;

    document.getElementById("minute")
    .innerHTML=1;


    placePlayers();

    moveBall();


    document.getElementById("log")
    .innerHTML=
    "🏟️ سوت شروع مسابقه!<br>"+
    homeTeam+
    " 🆚 "+
    awayTeam;


    document.getElementById("result")
    .innerHTML=
    "🤖 بازیکنان خودشان بازی می‌کنند.";


    playing=true;

    timer=setInterval(gameTick,700);

}


function placePlayers(){

    for(let i=1;i<=11;i++){

        const h =
        document.getElementById("h"+i);

        const a =
        document.getElementById("a"+i);


        h.style.left=
        homeBase[i-1][0]+"%";

        h.style.top=
        homeBase[i-1][1]+"%";


        a.style.left=
        awayBase[i-1][0]+"%";

        a.style.top=
        awayBase[i-1][1]+"%";
    }
}


function gameTick(){

    if(!playing)return;


    minute++;

    document.getElementById("minute")
    .innerHTML=minute;


    movePlayers();

    moveBallAI();


    if(Math.random()<0.035){

        shoot();

    }


    if(minute>=90){

        finishMatch();

    }
}


function movePlayers(){

    for(let i=1;i<=11;i++){

        const h=
        document.getElementById("h"+i);

        const a=
        document.getElementById("a"+i);


        let hx=
        parseFloat(h.style.left);

        let hy=
        parseFloat(h.style.top);


        let ax=
        parseFloat(a.style.left);

        let ay=
        parseFloat(a.style.top);


        hx +=
        (ballX-hx)*0.06;

        hy +=
        (ballY-hy)*0.06;


        ax +=
        (ballX-ax)*0.055;

        ay +=
        (ballY-ay)*0.055;


        if(tactic==="attack"){

            hx+=0.5;

        }


        if(tactic==="defend"){

            hx-=0.5;

        }


        hx=Math.max(3,Math.min(55,hx));
        hy=Math.max(5,Math.min(92,hy));

        ax=Math.max(45,Math.min(97,ax));
        ay=Math.max(5,Math.min(92,ay));


        h.style.left=hx+"%";
        h.style.top=hy+"%";

        a.style.left=ax+"%";
        a.style.top=ay+"%";
    }
}


function moveBallAI(){

    let targetX;
    let targetY;


    if(ballOwner==="home"){

        targetX=
        55+
        Math.random()*12;

        targetY=
        20+
        Math.random()*60;

    }
    else{

        targetX=
        33-
        Math.random()*12;

        targetY=
        20+
        Math.random()*60;

    }


    ballX +=
    (targetX-ballX)*0.13;

    ballY +=
    (targetY-ballY)*0.13;


    moveBall();


    if(Math.random()<0.08){

        ballOwner=
        ballOwner==="home"
        ?"away"
        :"home";


        addLog(
        ballOwner==="home"
        ?"🔵 توپ به تیم شما رسید!"
        :"⚪ حریف توپ را گرفت!"
        );
    }
}


function moveBall(){

    const ball=
    document.getElementById("ball");

    ball.style.left=
    ballX+"%";

    ball.style.top=
    ballY+"%";
}


function shoot(){

    if(ballOwner==="home"){

        addLog(
        "🔥 "+homeTeam+
        " شوت زد!"
        );


        if(Math.random()<0.28){

            goal("home");

        }
        else{

            addLog("🧤 دروازه‌بان حریف توپ را گرفت.");

        }

    }
    else{

        addLog(
        "⚡ "+awayTeam+
        " شوت زد!"
        );


        if(Math.random()<0.25){

            goal("away");

        }
        else{

            addLog("🧤 دروازه‌بان شما توپ را مهار کرد.");

        }
    }
}


function goal(team){

    if(team==="home"){

        homeScore++;

        document.getElementById("homeScore")
        .innerHTML=homeScore;


        addLog(
        "⚽🔥 گوووول "+homeTeam+
        "! دقیقه "+minute
        );


        ballOwner="away";

    }
    else{

        awayScore++;

        document.getElementById("awayScore")
        .innerHTML=awayScore;


        addLog(
        "⚽ "+awayTeam+
        " گل زد! دقیقه "+minute
        );


        ballOwner="home";
    }


    ballX=50;
    ballY=50;

    moveBall();
}


function setTactic(type){

    tactic=type;


    if(type==="attack"){

        addLog("🔥 تاکتیک هجومی فعال شد.");

    }
    else{

        addLog("🛡️ تاکتیک دفاعی فعال شد.");

    }
}


function addLog(text){

    const log=
    document.getElementById("log");


    log.innerHTML +=
    "<br>"+text;


    log.scrollTop=
    log.scrollHeight;
}


function finishMatch(){

    clearInterval(timer);

    playing=false;


    let result;


    if(homeScore>awayScore){

        result=
        "🏆 برد تیم شما!";

    }
    else if(awayScore>homeScore){

        result=
        "❌ تیم شما باخت.";

    }
    else{

        result=
        "🤝 بازی مساوی شد.";

    }


    document.getElementById("result")
    .innerHTML=
    result+
    "<br>نتیجه نهایی: "+
    homeScore+
    " - "+
    awayScore;


    addLog("🏁 سوت پایان مسابقه!");

}

</script>
</body>

</html>
