<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ بازار بازیکنان | گیمی‌مود</title>
<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:white;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:20px;
text-align:center;
}

header h1{
margin:0 0 8px;
}

header p{
margin:0;
color:#dffaff;
}

.top{
width:94%;
max-width:1000px;
margin:18px auto;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

button,
input{
font-family:tahoma;
}

button{
border:0;
border-radius:12px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
}

.filter{
background:#292929;
color:white;
}

.filter.active{
background:#00bcd4;
}

.search{
width:94%;
max-width:500px;
margin:0 auto 18px;
display:block;
padding:14px;
border:0;
border-radius:12px;
font-size:16px;
outline:0;
}

.wallet{
width:94%;
max-width:1000px;
margin:15px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.money{
background:#1c1c1c;
padding:15px;
border-radius:14px;
text-align:center;
font-size:18px;
}

.grid{
width:94%;
max-width:1000px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:15px;
}

.card{
background:#1c1c1c;
border-radius:18px;
padding:15px;
box-shadow:0 5px 15px #000;
}

.avatar{
height:120px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
background:linear-gradient(135deg,#333,#111);
margin-bottom:12px;
}

.name{
font-size:19px;
font-weight:bold;
}

.country{
color:#aaa;
margin-top:5px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin:12px 0;
}

.stat{
background:#282828;
padding:8px;
border-radius:8px;
}

.price{
color:#ffd700;
font-weight:bold;
font-size:18px;
margin:10px 0;
}

.buy{
width:100%;
background:#00bcd4;
color:white;
}

.buy:hover{
background:#00e5ff;
}

.buy:disabled{
background:#555;
cursor:not-allowed;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:8px;
font-size:12px;
background:#333;
margin-top:8px;
}

.empty{
text-align:center;
padding:30px;
color:#aaa;
grid-column:1/-1;
}

.back{
display:block;
width:230px;
margin:25px auto;
padding:14px;
background:#333;
color:white;
text-decoration:none;
border-radius:12px;
text-align:center;
}

@media(max-width:500px){

.wallet{
grid-template-columns:1fr;
}

}
</style>
</head>
<body>
<header>
<h1>🛒 بازار بازیکنان</h1>
<p>
بازیکن ایرانی یا خارجی انتخاب کن و به تیم خودت اضافه کن
</p>
</header>
<div class="wallet">
<div class="money">
💰 سکه:
<span id="coins">30000</span>
</div>
<div class="money">
💎 الماس:
<span id="diamonds">0</span>
</div>
</div>
<div class="top">
<button
class="filter active"
id="allBtn"
onclick="setFilter('all')">
🌍 همه
</button>
<button
class="filter"
id="iranBtn"
onclick="setFilter('iran')">
🇮🇷 ایرانی
</button>
<button
class="filter"
id="foreignBtn"
onclick="setFilter('foreign')">
🌎 خارجی
</button>
</div>
<input
class="search"
id="search"
placeholder="🔎 نام بازیکن را جستجو کن..."
oninput="renderPlayers()"

<div
class="grid"
id="players">
</div>
<a
class="back"
href="myteam.html">
⬅️ برگشت به تیم من
</a>
<script>

/* =================================
   اطلاعات پول
================================= */

let coins=
Number(
localStorage.getItem("coins")
);

if(
!Number.isFinite(coins)
){

coins=30000;

localStorage.setItem(
"coins",
coins
);

}


let diamonds=
Number(
localStorage.getItem("diamonds")
);

if(
!Number.isFinite(diamonds)
){

diamonds=0;

localStorage.setItem(
"diamonds",
diamonds
);

}


let filter="all";


/* =================================
   بازیکنان ایرانی
================================= */

const iranianNames=[

"علیرضا نیازمند",
"علیرضا بیرانوند",
"پیام نیازمند",
"حسین حسینی",
"محمدرضا اخباری",
"سیدحسین حسینی",
"امیر عابدزاده",
"حامد لک",
"محمد دانشگر",
"شجاع خلیل‌زاده",
"مرتضی پورعلی‌گنجی",
"محمدحسین کنعانی‌زادگان",
"رامین رضاییان",
"میلاد محمدی",
"احسان حاج‌صفی",
"صادق محرمی",
"دانیال اسماعیلی‌فر",
"امید نورافکن",
"روزبه چشمی",
"علی نعمتی",
"عارف غلامی",
"سامان فلاح",
"محمد قربانی",
"سعید عزت‌اللهی",
"احمد نوراللهی",
"وحید امیری",
"مهدی ترابی",
"علی قلی‌زاده",
"علیرضا جهانبخش",
"سردار آزمون",
"مهدی طارمی",
"محمد محبی",
"امیرحسین حسین‌زاده",
"محمد خدابنده‌لو",
"یاسین سلمانی",
"ابوالفضل جلالی",
"آریا یوسفی",
"امیرمحمد هوشمند",
"محمدجواد حسین‌نژاد",
"قاسم حدادی‌فر"

];


/* =================================
   بازیکنان خارجی
================================= */

const foreignNames=[

"لیونل مسی",
"کریستیانو رونالدو",
"کیلیان امباپه",
"لامین یامال",
"ارلینگ هالند",
"وینیسیوس جونیور",
"جود بلینگام",
"محمد صلاح",
"کوین دی‌بروینه",
"رودری",
"هری کین",
"روبرت لواندوفسکی",
"عثمان دمبله",
"فیل فودن",
"بوکایو ساکا",
"فلوریان ویرتز",
"پدری",
"گاوی",
"دکلان رایس",
"مارتین اودگارد",
"ویرجیل فن‌دایک",
"آلیسون بکر",
"تیبو کورتوا",
"مانوئل نویر",
"جان‌لوییجی دوناروما",
"رودریگو",
"رافینیا",
"سون هیونگ مین",
"لوکاس پاکتا",
"برونو فرناندز",
"کازمیرو",
"آنتوان گریزمان",
"نیکلاس اوتامندی",
"لائوتارو مارتینز",
"جمال موسیالا",
"هری مگوایر",
"ترنت الکساندر آرنولد",
"اشرف حکیمی",
"آلفونسو دیویس",
"ژائو کانسلو"

];


/* =================================
   ساخت ۱۰۰۰ بازیکن ایرانی
================================= */

let players=[];

for(
let i=0;
i<1000;
i++
){

let base=
iranianNames[
i%iranianNames.length
];

let name=
i<iranianNames.length
? base
: base+" "+(i+1);


let power=
60+
(i%31);


let price=
3000+
(i%30)*150;


let position=
["GK","DEF","MID","ATT"][
i%4
];


players.push({

id:"ir_"+i,

name:name,

country:"ایران",

type:"iran",

power:power,

price:price,

currency:"coins",

position:position

});

}


/* =================================
   ساخت ۱۰۰۰ بازیکن خارجی
================================= */

for(
let i=0;
i<1000;
i++
){

let base=
foreignNames[
i%foreignNames.length
];

let name=
i<foreignNames.length
? base
: base+" "+(i+1);


let power=
70+
(i%31);


let price=
7000+
(i%50)*500;


let position=
["GK","DEF","MID","ATT"][
i%4
];


players.push({

id:"fr_"+i,

name:name,

country:"خارجی",

type:"foreign",

power:power,

price:price,

currency:"coins",

position:position

});

}


/* =================================
   بازیکنان الماسی
================================= */

players.push({

id:"diamond_ronaldo",

name:"کریستیانو رونالدو",

country:"پرتغال",

type:"foreign",

power:100,

price:20,

currency:"diamonds",

position:"ATT"

});


players.push({

id:"diamond_yamal",

name:"لامین یامال",

country:"اسپانیا",

type:"foreign",

power:100,

price:20,

currency:"diamonds",

position:"ATT"

});


players.push({

id:"diamond_mbappe",

name:"کیلیان امباپه",

country:"فرانسه",

type:"foreign",

power:100,

price:20,

currency:"diamonds",

position:"ATT"

});


/* =================================
   پول
================================= */

function updateWallet(){

document.getElementById(
"coins"
).innerHTML=
coins.toLocaleString("fa-IR");


document.getElementById(
"diamonds"
).innerHTML=
diamonds.toLocaleString("fa-IR");

}


/* =================================
   فیلتر
================================= */

function setFilter(type){

filter=type;


document
.querySelectorAll(".filter")
.forEach(
btn=>
btn.classList.remove("active")
);


if(type==="all"){

document
.getElementById("allBtn")
.classList.add("active");

}

if(type==="iran"){

document
.getElementById("iranBtn")
.classList.add("active");

}

if(type==="foreign"){

document
.getElementById("foreignBtn")
.classList.add("active");

}


renderPlayers();

}


/* =================================
   خرید
================================= */

function buyPlayer(id){

let player=
players.find(
p=>p.id===id
);

if(!player)return;


/* بازیکنان خریداری‌شده */

let owned=
JSON.parse(
localStorage.getItem("ownedPlayers")
) || [];


if(
owned.some(
p=>p.id===id
)
){

alert(
"این بازیکن را قبلاً خریدی!"
);

return;

}


/* پرداخت */

if(
player.currency==="diamonds"
){

if(
diamonds<player.price
){

alert(
"💎 الماس کافی نداری!"
);

return;

}

diamonds-=player.price;

localStorage.setItem(
"diamonds",
diamonds
);

}
else{

if(
coins<player.price
){

alert(
"💰 سکه کافی نداری!"
);

return;

}

coins-=player.price;

localStorage.setItem(
"coins",
coins
);

}


/* ذخیره */

owned.push(player);

localStorage.setItem(
"ownedPlayers",
JSON.stringify(owned)
);


/* اضافه کردن به تیم */

let lineup=
JSON.parse(
localStorage.getItem("lineup")
) || {};


let key=
"player_"+Date.now();


lineup[key]={

id:player.id,

name:player.name,

power:player.power,

position:player.position,

country:player.country

};


localStorage.setItem(
"lineup",
JSON.stringify(lineup)
);


updateWallet();

renderPlayers();


alert(
"✅ "+
player.name+
" به تیم تو اضافه شد!"
);

}


/* =================================
   نمایش
================================= */

function renderPlayers(){

let container=
document.getElementById(
"players"
);

let search=
document.getElementById(
"search"
).value
.trim()
.toLowerCase();


let list=
players.filter(
p=>{

let typeOK=
filter==="all"
||
p.type===filter;

let searchOK=
!search
||
p.name
.toLowerCase()
.includes(search);

return typeOK && searchOK;

}
);


/*
   برای اینکه صفحه سنگین نشود
   اول 60 بازیکن نشان می‌دهیم.
*/

list=
list.slice(0,60);


container.innerHTML="";


if(!list.length){

container.innerHTML=
'<div class="empty">بازیکنی پیدا نشد.</div>';

return;

}


let owned=
JSON.parse(
localStorage.getItem("ownedPlayers")
) || [];


list.forEach(
player=>{

let isOwned=
owned.some(
p=>p.id===player.id
);


let price=
player.price.toLocaleString(
"fa-IR"
);


let currency=
player.currency==="diamonds"
? "💎"
: "💰";


let card=
document.createElement("div");

card.className="card";


card.innerHTML=

'<div class="avatar">⚽</div>'+

'<div class="name">'+
player.name+
'</div>'+

'<div class="country">'+
(player.type==="iran"
? "🇮🇷 "
: "🌎 ")+
player.country+
'</div>'+

'<span class="badge">'+
positionName(player.position)+
'</span>'+

'<div class="stats">'+

'<div class="stat">'+
'قدرت<br><b>'+
player.power+
'</b>'+
'</div>'+

'<div class="stat">'+
'نوع<br><b>'+
(player.type==="iran"
? "ایرانی"
: "خارجی")+
'</b>'+
'</div>'+

'</div>'+

'<div class="price">'+
currency+
' '+
price+
'</div>'+

'<button '+
'class="buy" '+
'>'+
(isOwned
? "✅ خریداری شده"
: "🛒 خرید بازیکن")+
'</button>';


let button=
card.querySelector(".buy");


if(isOwned){

button.disabled=true;

}
else{

button.onclick=
function(){

buyPlayer(player.id);

};

}


container.appendChild(card);

}
);

}


/* =================================
   نام پست
================================= */

function positionName(position){

if(position==="GK")
return "🧤 دروازه‌بان";

if(position==="DEF")
return "🛡️ مدافع";

if(position==="MID")
return "🎯 هافبک";

return "⚡ مهاجم";

}


/* =================================
   شروع
================================= */

updateWallet();

renderPlayers();

</script>
</body>

</html>
