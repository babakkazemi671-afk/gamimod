<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛒 بازار بازیکنان | گیمی‌مود</title>
<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:white;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:20px;
text-align:center;
font-size:27px;
font-weight:bold;
}

.box{
width:94%;
max-width:1000px;
margin:20px auto;
padding:20px;
background:#202020;
border-radius:20px;
box-shadow:0 0 15px #000;
}

.balance{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.money{
background:#151515;
padding:15px;
border-radius:14px;
text-align:center;
font-size:19px;
}

.money b{
display:block;
color:#00e5ff;
font-size:24px;
margin-top:7px;
}

.players{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(190px,1fr));
gap:15px;
}

.card{
background:#171717;
border:2px solid #333;
border-radius:16px;
padding:18px;
text-align:center;
}

.flag{
font-size:30px;
}

.name{
font-size:19px;
font-weight:bold;
margin:8px 0;
}

.position{
color:#aaa;
}

.rating{
font-size:25px;
color:#ffd700;
margin:10px;
}

.price{
color:#00e5ff;
font-weight:bold;
margin:10px;
}

button{
border:0;
border-radius:11px;
padding:12px 20px;
background:#16a085;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#555;
}

.message{
margin-top:15px;
padding:15px;
background:#151515;
border-radius:12px;
text-align:center;
line-height:2;
}

.back{
display:block;
width:230px;
margin:25px auto;
padding:14px;
background:#333;
color:white;
text-align:center;
text-decoration:none;
border-radius:12px;
}

</style>
</head>
<body>
<header>
🛒 بازار بازیکنان
</header>
<section class="box">
<div class="balance">
<div class="money">
🪙 سکه
<b id="coins">10000</b>
</div>
<div class="money">
💎 الماس
<b id="diamonds">0</b>
</div>
</div>
</section>
<section class="box">
<h2 style="text-align:center;color:#00e5ff">
🇮🇷 بازیکنان ایرانی
</h2>
<div class="players" id="iranian"></div>
</section>
<section class="box">
<h2 style="text-align:center;color:#ffd700">
🌍 بازیکنان ویژه خارجی
</h2>
<div class="players" id="foreign"></div>
</section>
<div class="message" id="message">
بازیکن موردنظرت را انتخاب کن.
</div>
<a class="back" href="myteam.html">
⬅️ برگشت به تیم من
</a>
<script>

/* =========================
   موجودی
========================= */

let coins =
Number(
localStorage.getItem("coins")
);

if(!coins){

coins=10000;

localStorage.setItem(
"coins",
coins
);

}


let diamonds =
Number(
localStorage.getItem(
"footballDiamonds"
)
) || 0;


/* =========================
   بازیکنان ایرانی
========================= */

const iranianPlayers=[

{
name:"مهدی ترابی",
position:"MID",
rating:82,
price:3000
},

{
name:"مهدی قایدی",
position:"ATT",
rating:84,
price:3200
},

{
name:"علیرضا بیرانوند",
position:"GK",
rating:80,
price:2800
},

{
name:"سردار آزمون",
position:"ATT",
rating:88,
price:4000
},

{
name:"مهدی طارمی",
position:"ATT",
rating:90,
price:4500
},

{
name:"محمد محبی",
position:"ATT",
rating:81,
price:2900
},

{
name:"میلاد محمدی",
position:"DEF",
rating:78,
price:2500
},

{
name:"احمد نوراللهی",
position:"MID",
rating:80,
price:2800
}

];


/* =========================
   بازیکنان خارجی ویژه
========================= */

const foreignPlayers=[

{
name:"کریستیانو رونالدو",
position:"ATT",
rating:100,
diamonds:100
},

{
name:"کیلیان امباپه",
position:"ATT",
rating:100,
diamonds:100
},

{
name:"لامین یامال",
position:"ATT",
rating:100,
diamonds:100
}

];


/* =========================
   نمایش
========================= */

function showPlayers(){

renderIranian();

renderForeign();

updateBalance();

}


function renderIranian(){

const box=
document.getElementById(
"iranian"
);

box.innerHTML="";


iranianPlayers.forEach(
function(player,index){

const card=
document.createElement("div");

card.className="card";

card.innerHTML=

"<div class='flag'>🇮🇷</div>"+

"<div class='name'>"+
player.name+
"</div>"+

"<div class='position'>"+
positionName(player.position)+
"</div>"+

"<div class='rating'>⭐ "+
player.rating+
"</div>"+

"<div class='price'>"+
player.price+
" 🪙</div>"+

"<button onclick='buyIranian("+
index+
")'>"+
"🛒 خرید بازیکن"+
"</button>";


box.appendChild(card);

});

}


function renderForeign(){

const box=
document.getElementById(
"foreign"
);

box.innerHTML="";


foreignPlayers.forEach(
function(player,index){

const card=
document.createElement("div");

card.className="card";

card.innerHTML=

"<div class='flag'>🌍</div>"+

"<div class='name'>"+
player.name+
"</div>"+

"<div class='position'>"+
positionName(player.position)+
"</div>"+

"<div class='rating'>⭐ "+
player.rating+
"</div>"+

"<div class='price'>"+
player.diamonds+
" 💎</div>"+

"<button onclick='buyForeign("+
index+
")'>"+
"💎 خرید با الماس"+
"</button>";


box.appendChild(card);

});

}


/* =========================
   نام پست
========================= */

function positionName(position){

if(position==="GK")
return "🧤 دروازه‌بان";

if(position==="DEF")
return "🛡️ مدافع";

if(position==="MID")
return "⚡ هافبک";

return "🔥 مهاجم";

}


/* =========================
   خرید ایرانی
========================= */

function buyIranian(index){

const player=
iranianPlayers[index];


if(coins<player.price){

showMessage(
"❌ سکه کافی نداری!"
);

return;

}


coins-=player.price;


addPlayer(player);


localStorage.setItem(
"coins",
coins
);


showMessage(
"✅ "+
player.name+
" به تیم تو اضافه شد!"
);


updateBalance();

}


/* =========================
   خرید خارجی
========================= */

function buyForeign(index){

const player=
foreignPlayers[index];


if(diamonds<player.diamonds){

showMessage(
"💎 الماس کافی نداری!"
);

return;

}


diamonds-=player.diamonds;


addPlayer(player);


localStorage.setItem(
"footballDiamonds",
diamonds
);


showMessage(
"🔥 "+
player.name+
" با قدرت "+
player.rating+
" به تیم تو اضافه شد!"
);


updateBalance();

}


/* =========================
   افزودن به تیم
========================= */

function addPlayer(player){

let myPlayers=
JSON.parse(
localStorage.getItem(
"myPlayers"
)
) || [];


myPlayers.push({

name:player.name,

position:player.position,

rating:player.rating

});


localStorage.setItem(
"myPlayers",
JSON.stringify(
myPlayers
)
);


/* افزایش قدرت تیم */

let power=
Number(
localStorage.getItem(
"clubPower"
)
) || 60;


power=
Math.min(
100,
power+Math.ceil(
player.rating/25
)
);


localStorage.setItem(
"clubPower",
power
);

}


/* =========================
   موجودی
========================= */

function updateBalance(){

document.getElementById(
"coins"
).innerHTML=
coins;

document.getElementById(
"diamonds"
).innerHTML=
diamonds;

}


/* =========================
   پیام
========================= */

function showMessage(text){

document.getElementById(
"message"
).innerHTML=
text;

}


showPlayers();

</script>
</body>
</html>
