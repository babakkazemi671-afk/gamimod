<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏆 لیگ فوتبال | گیمی‌مود</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma;
background:#101010;
color:white;
}

header{
background:linear-gradient(135deg,#00bcd4,#006b7a);
padding:20px;
text-align:center;
font-size:27px;
font-weight:bold;
}

.box{
width:94%;
max-width:1000px;
margin:18px auto;
padding:20px;
background:#202020;
border-radius:20px;
box-shadow:0 0 15px #000;
}

.info{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(145px,1fr));
gap:10px;
}

.stat{
background:#151515;
padding:14px;
border-radius:14px;
text-align:center;
}

.stat span{
display:block;
color:#aaa;
font-size:13px;
}

.stat b{
display:block;
margin-top:7px;
font-size:22px;
color:#00e5ff;
}

h2{
text-align:center;
}

.match{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:13px;
margin:8px 0;
background:#171717;
border-radius:12px;
border-right:4px solid #00bcd4;
}

.played{
border-right-color:#16a085;
}

.match button{
border:0;
border-radius:9px;
padding:9px 13px;
background:#e67e22;
color:white;
font-weight:bold;
cursor:pointer;
}

.match button:disabled{
background:#555;
}

.teams{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}

.team{
background:#151515;
padding:13px;
border-radius:12px;
text-align:center;
}

.team b{
color:#00e5ff;
font-size:20px;
}

.reward{
background:#151515;
padding:15px;
border-radius:12px;
line-height:2;
}

.back{
display:block;
width:230px;
margin:25px auto;
padding:14px;
background:#333;
color:white;
text-decoration:none;
border-radius:12px;
text-align:center;
}

</style>
</head>
<body>
<header>
🏆 لیگ فوتبال گیمی‌مود
</header>
<section class="box">
<h2>📊 وضعیت تیم</h2>
<div class="info">
<div class="stat">
<span>🏟️ باشگاه</span>
<b id="club">تیم من</b>
</div>
<div class="stat">
<span>🏆 لیگ</span>
<b id="league">دسته دو</b>
</div>
<div class="stat">
<span>⭐ قدرت</span>
<b id="power">60</b>
</div>
<div class="stat">
<span>💎 الماس</span>
<b id="diamonds">0</b>
</div>
<div class="stat">
<span>📅 بازی</span>
<b id="gameNumber">0 / 30</b>
</div>
</div>
</section>
<section class="box">
<h2>🏟️ تیم‌های لیگ</h2>
<div class="teams" id="teams"></div>
</section>
<section class="box">
<h2>📅 بازی‌های فصل</h2>
<div id="fixtures"></div>
</section>
<section class="box">
<h2>💎 جوایز صعود</h2>
<div class="reward">
🥈 قهرمانی لیگ دسته دو:
<strong>5 💎</strong>
<br>
🥇 قهرمانی لیگ دسته یک:
<strong>10 💎</strong>
<br>
🏆 قهرمانی لیگ برتر:
<strong>20 💎</strong>
<br>
🌏 قهرمانی جام آسیا:
<strong>75 💎</strong>
<br>
🌎 قهرمانی جام جهانی:
<strong>100 💎</strong>
</div>
</section>
<a class="back" href="myteam.html">
⬅️ برگشت به تیم من
</a>
<script>

/* =========================
   اطلاعات تیم
========================= */

let clubName=
localStorage.getItem(
"clubName"
) || "تیم من";

let power=
Number(
localStorage.getItem(
"clubPower"
)
) || 60;

let diamonds=
Number(
localStorage.getItem(
"footballDiamonds"
)
) || 0;

let league=
localStorage.getItem(
"currentLeague"
) || "دسته دو";

let gameNumber=
Number(
localStorage.getItem(
"leagueGame"
)
) || 0;


/* =========================
   تیم‌های ایرانی
========================= */

const leagueTeams={

"دسته دو":[
"تیم من",
"پارس جوان",
"کویر FC",
"شاهین شمال",
"سپیدار",
"آریا شهر",
"دریای خزر",
"پاس نوین"
],

"دسته یک":[
"تیم من",
"پیکان",
"فجر سپاسی",
"مس کرمان",
"شمس آذر",
"سایپا",
"نفت مسجدسلیمان",
"نساجی"
],

"لیگ برتر":[
"تیم من",
"پرسپولیس",
"استقلال",
"سپاهان",
"تراکتور",
"ذوب‌آهن",
"فولاد",
"گل‌گهر"
]

};


/* =========================
   نمایش
========================= */

document.getElementById(
"club"
).innerHTML=
clubName;

document.getElementById(
"league"
).innerHTML=
league;

document.getElementById(
"power"
).innerHTML=
power;

document.getElementById(
"diamonds"
).innerHTML=
diamonds;

document.getElementById(
"gameNumber"
).innerHTML=
gameNumber+
" / 30";


/* =========================
   تیم‌ها
========================= */

function showTeams(){

const box=
document.getElementById(
"teams"
);

box.innerHTML="";


let teams=
leagueTeams[league];


teams.forEach(
function(team,index){

let strength=
55+
(index*4);

if(team==="تیم من"){
strength=power;
}

let div=
document.createElement(
"div"
);

div.className="team";

div.innerHTML=
"⚽ "+
team+
"<br>"+
"⭐ قدرت "+
"<b>"+
strength+
"</b>";

box.appendChild(div);

});

}


/* =========================
   ساخت بازی‌ها
========================= */

function createFixtures(){

const box=
document.getElementById(
"fixtures"
);

box.innerHTML="";


let teams=
leagueTeams[league]
.filter(
team=>team!=="تیم من"
);


for(
let i=1;
i<=30;
i++
){

let opponent=
teams[
(i-1)%
teams.length
];


let div=
document.createElement(
"div"
);

div.className=
"match";


let status=
i<=gameNumber
?"✅ انجام شد"
:"⏳ آماده";


let disabled=
i!==gameNumber+1
?"disabled"
:"";


div.innerHTML=

"<span>بازی "+
i+
"</span>"+

"<strong>"+
clubName+
" 🆚 "+
opponent+
"</strong>"+

"<span>"+
status+
"</span>"+

"<button "+
disabled+
" onclick='playGame("+
i+
")'>"+
"⚽ بازی"+
"</button>";


if(i<=gameNumber){

div.classList.add(
"played"
);

}

box.appendChild(
div
);

}

}


/* =========================
   انجام مسابقه
========================= */

function playGame(number){

if(number!==gameNumber+1){
return;
}


localStorage.setItem(
"leagueOpponent",
leagueTeams[league][
(number-1)%
leagueTeams[league].length
]
);


/* football.html بازی را اجرا می‌کند */

window.location.href=
"football.html";

}


/* =========================
   بعد از برگشت مسابقه
========================= */

function completeGame(){

gameNumber++;

if(gameNumber>30){

gameNumber=0;

promote();

}


localStorage.setItem(
"leagueGame",
gameNumber
);

}


/* =========================
   صعود
========================= */

function promote(){

if(league==="دسته دو"){

league="دسته یک";

localStorage.setItem(
"currentLeague",
league
);

addDiamonds(5);

alert(
"🎉 قهرمان دسته دو شدی!"+
"\n"+
"5 💎 گرفتی!"+
"\n"+
"⬆️ صعود به لیگ دسته یک"
);

}

else if(league==="دسته یک"){

league="لیگ برتر";

localStorage.setItem(
"currentLeague",
league
);

addDiamonds(10);

alert(
"🎉 قهرمان دسته یک شدی!"+
"\n"+
"10 💎 گرفتی!"+
"\n"+
"⬆️ صعود به لیگ برتر"
);

}

else{

addDiamonds(20);

alert(
"🏆 قهرمان لیگ برتر شدی!"+
"\n"+
"20 💎 گرفتی!"
);

}

}


/* =========================
   الماس
========================= */

function addDiamonds(amount){

diamonds+=amount;

localStorage.setItem(
"footballDiamonds",
diamonds
);

}


/* =========================
   شروع
========================= */

showTeams();

createFixtures();

</script>
</body>
</html>
