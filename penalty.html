<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚽ پنالتی | گیمی‌مود</title>
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:tahoma;
    background:#101010;
    color:white;
    text-align:center;
}

header{
    background:#00bcd4;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.balance{
    margin:20px;
    padding:20px;
    background:linear-gradient(135deg,#302b63,#24243e);
    border-radius:20px;
}

.coins{
    font-size:32px;
    font-weight:bold;
}

.game{
    width:94%;
    max-width:650px;
    margin:20px auto;
    padding:20px 15px;
    background:#202020;
    border-radius:20px;
    box-shadow:0 0 15px #000;
}

.goal{
    position:relative;
    width:100%;
    max-width:500px;
    height:280px;
    margin:20px auto;
    background:
    linear-gradient(
        #168a3a 0 78%,
        #126b30 78% 100%
    );
    border:8px solid white;
    border-bottom:12px solid white;
    overflow:hidden;
}

.net{
    position:absolute;
    inset:0;
    background:
    repeating-linear-gradient(
        0deg,
        transparent 0 24px,
        rgba(255,255,255,.25) 25px
    ),
    repeating-linear-gradient(
        90deg,
        transparent 0 24px,
        rgba(255,255,255,.25) 25px
    );
}

.keeper{
    position:absolute;
    font-size:55px;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    transition:.3s;
}

.ball{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    font-size:42px;
    transition:.5s;
}

.directions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    max-width:500px;
    margin:15px auto;
}

.kick{
    padding:14px 5px;
    border:0;
    border-radius:12px;
    background:#333;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.kick:hover{
    background:#00bcd4;
}

.kick:disabled{
    background:#555;
    cursor:not-allowed;
}

.result{
    margin:20px auto;
    padding:15px;
    background:#151515;
    border-radius:12px;
    line-height:2;
}

.start{
    padding:13px 25px;
    border:0;
    border-radius:12px;
    background:#00bcd4;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.back{
    display:block;
    width:230px;
    margin:25px auto;
    padding:14px;
    background:#333;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
}

</style>
</head>
<body>
<header>
⚽ پنالتی گیمی‌مود
</header>
<section class="balance">
<h2>🐷 موجودی قلک</h2>
<div class="coins" id="coins">
0 🪙
</div>
</section>
<section class="game">
<h2>⚽ پنالتی بزن!</h2>
<p>
یک گوشه دروازه را انتخاب کن.
</p>
<div class="goal">
<div class="net"></div>
<div class="keeper" id="keeper">
🧤
</div>
<div class="ball" id="ball">
⚽
</div>
</div>
<div class="directions">
<button class="kick" onclick="shoot('left')">
⬅️ چپ
</button>
<button class="kick" onclick="shoot('center')">
⬆️ وسط
</button>
<button class="kick" onclick="shoot('right')">
➡️ راست
</button>
</div>
<div class="result" id="result">
هر گل = ۳۰ 🪙
</div>
<button
class="start"
id="startButton"
onclick="newRound()">
🔄 پنالتی بعدی
</button>
</section>
<a class="back" href="coin.html">
⬅️ برگشت به مرکز سرگرمی
</a>
<script>

/* =========================
   سکه مشترک
========================= */

let coins =
Number(localStorage.getItem("gamimodCoins")) || 0;


function updateCoins(){

    document.getElementById(
        "coins"
    ).innerHTML =
    coins + " 🪙";

}


function saveCoins(){

    localStorage.setItem(
        "gamimodCoins",
        coins
    );

    updateCoins();

}


updateCoins();


/* =========================
   بازی
========================= */

let playing = true;


/* =========================
   پنالتی جدید
========================= */

function newRound(){

    playing = true;


    document.getElementById(
        "ball"
    ).style.left =
    "50%";


    document.getElementById(
        "ball"
    ).style.bottom =
    "15px";


    document.getElementById(
        "keeper"
    ).style.left =
    "50%";


    document.getElementById(
        "result"
    ).innerHTML =
    "⚽ یک گوشه را انتخاب کن!";


    document.querySelectorAll(
        ".kick"
    ).forEach(
    function(button){

        button.disabled = false;

    });

}


/* =========================
   شوت
========================= */

function shoot(direction){

    if(!playing){

        return;

    }


    playing = false;


    document.querySelectorAll(
        ".kick"
    ).forEach(
    function(button){

        button.disabled = true;

    });


    const keeperDirections =
    [
        "left",
        "center",
        "right"
    ];


    const keeper =
    keeperDirections[
        Math.floor(
            Math.random() * 3
        )
    ];


    const positions = {

        left:"20%",

        center:"50%",

        right:"80%"

    };


    document.getElementById(
        "ball"
    ).style.left =
    positions[direction];


    document.getElementById(
        "ball"
    ).style.bottom =
    "190px";


    document.getElementById(
        "keeper"
    ).style.left =
    positions[keeper];


    setTimeout(
    function(){

        if(
            direction !== keeper
        ){

            coins += 30;

            saveCoins();


            document.getElementById(
                "result"
            ).innerHTML =
            "🥅 گــــــل! 🎉<br>" +
            "+30 🪙 سکه گرفتی!";

        }

        else{

            document.getElementById(
                "result"
            ).innerHTML =
            "🧤 سیو کرد!<br>" +
            "❌ این بار سکه نگرفتی.";

        }

    },550);

}


/* شروع */

newRound();

</script>
</body>
  </html>
