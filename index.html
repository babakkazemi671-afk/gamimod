<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMIMOD</title>

<style>

body{
    margin:0;
    background:#080808;
    color:white;
    font-family:tahoma;
}


/* بنر */

.banner{

    background:linear-gradient(135deg,#111,#004422);

    padding:80px 20px;

    text-align:center;

    border-radius:0 0 35px 35px;

}


.banner h1{

    font-size:55px;
    color:#00ff99;

}


.banner h2{

    font-size:30px;

}


.btn{

    display:inline-block;

    background:#00ff99;

    color:black;

    padding:15px 40px;

    border-radius:30px;

    text-decoration:none;

    font-weight:bold;

}



/* بخش بازی ها */

.games{

    padding:30px;

    text-align:center;

}



/* کارت بازی */

.game-card{

    background:#151515;

    margin:20px auto;

    padding:20px;

    border-radius:20px;

    max-width:300px;

}


.game-card img{

    width:100%;

    border-radius:15px;

}


.game-card a{

    display:inline-block;

    background:#00ff99;

    color:black;

    padding:10px 25px;

    border-radius:20px;

    text-decoration:none;

}


</style>


</head>


<body>



<div class="banner">

<h1>🎮 GAMIMOD</h1>

<h2>دانلود بازی‌های اندروید</h2>

<p>
جدیدترین بازی‌ها با لینک مستقیم
</p>

<a class="btn" href="#">
مشاهده بازی‌ها
</a>

</div>



<div class="games">


<h2>🔥 آخرین بازی‌ها</h2>


<div class="game-card">


<img src="game.jpg">


<h3>Mario Adventure</h3>


<p>📦 حجم: 200MB</p>


<p>⭐ امتیاز: 4.8</p>


<a href="#">
مشاهده بازی
</a>


</div>


</div>



</body>

</html>
