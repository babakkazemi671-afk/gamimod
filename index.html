<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAMIMOD | دانلود بازی اندروید</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#111;
color:white;
}

header{
background:#00bcd4;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.search{
padding:15px;
text-align:center;
}

.search input{
width:90%;
max-width:500px;
padding:12px;
border-radius:10px;
border:none;
font-size:18px;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#222;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 15px #000;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h2{
text-align:center;
}

.info{
padding:10px;
}

.btn{
display:block;
background:#00bcd4;
color:white;
text-align:center;
padding:12px;
margin:15px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

footer{
background:#000;
text-align:center;
padding:20px;
margin-top:20px;
}
</style>

</head>
<body>

<header>
🎮 GAMIMOD
</header>

<div class="search">
<input type="text" placeholder="جستجوی بازی...">
</div>

<div class="games">

<div class="card">
<img src="Screenshot_۲۰۲۶۰۶۲۰_۲۱۴۳۴۹_Google.jpg">
<div class="info">
<h2>Mario</h2>
<p>⭐ 4.8</p>
<p>💾 14 MB</p>
<a class="btn" href="mario.html">مشاهده بازی</a>
</div>
</div>

</div>

<footer>
© 2026 GAMIMOD
</footer>

</body>
</html>
